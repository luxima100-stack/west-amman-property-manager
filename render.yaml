services:
  - type: web
    name: west-amman-property-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: SUPABASE_BUCKET
        value: property-images
