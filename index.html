<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102f3b"><link rel="manifest" href="/manifest.json">
<title>إدارة عقارات غرب عمّان</title>
<style>
:root{--n:#102f3b;--n2:#0a222c;--g:#c8a45d;--g2:#ead59f;--bg:#f5f1e9;--c:#fffdf8;--t:#17262d;--m:#73818a;--line:#e7dfd1;--ok:#159a68;--bad:#d63f42;--blue:#277fd4;--orange:#ed8a1c;--shadow:0 12px 32px #09202b12}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#d7bc7350,transparent 28%),linear-gradient(135deg,#071923,#174654)}.loginbox{width:min(440px,92%);background:var(--c);border-radius:28px;padding:30px;box-shadow:0 28px 80px #0007}.logo{width:55px;height:55px;border-radius:16px;border:1px solid var(--g);background:var(--n);color:var(--g2);display:grid;place-items:center;margin:auto;font-size:27px}.loginbox h1{text-align:center;font-size:23px}.muted{color:var(--m)}.demo{background:#f1e9da;color:#6d5935;padding:12px;border-radius:13px;font-size:12px;line-height:1.8}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd4c5;border-radius:11px;background:#fff;outline:none}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700}.primary{background:var(--g);color:#17252b}.dark{background:var(--n);color:#fff}.ghost{background:#f0ece4;color:var(--t)}.danger{background:var(--bad);color:#fff}.success{background:var(--ok);color:#fff}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--n),var(--n2));color:#fff;padding:19px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:8px 4px 19px;border-bottom:1px solid #fff2}.brand .logo{margin:0;width:43px;height:43px;background:transparent}.brand b{font-size:15px}.brand small{color:#b9c6ca}.nav{padding-top:15px}.nav button{display:block;width:100%;background:transparent;border:0;color:#dce5e8;text-align:right;padding:12px;border-radius:12px;margin:2px 0}.nav button:hover,.nav button.active{background:#c8a45d1c;color:#fff;border-right:3px solid var(--g)}.main{min-width:0}.top{height:73px;background:#fffdf8ee;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}.top h2{font-size:20px;margin:0}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:var(--g2)}.content{padding:24px;max-width:1550px;margin:auto}.hero{border-radius:24px;background:linear-gradient(135deg,#123946,#0a202a 65%,#362c1b);color:#fff;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:var(--shadow)}.hero h3{font-size:27px;margin:6px 0}.hero small{color:var(--g2);font-weight:700}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin:17px 0}.stat,.panel{background:var(--c);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:15px}.stat .n{font-size:28px;font-weight:800}.stat .l{font-size:11px;color:var(--m)}.panel{padding:19px;margin-bottom:17px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.head h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd4c5;border-radius:10px;background:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.card h4{margin:0 0 7px}.meta{font-size:12px;line-height:1.9;color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700}.available{background:#dcf5e8;color:#087b4d}.near{background:#fff2bf;color:#866500}.soon{background:#dcecff;color:#1d69a8}.reserved{background:#ffe5cf;color:#a95000}.repair{background:#ffdcdc;color:#ad2222}.status-square{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid transparent}.status-square:before{content:"";width:11px;height:11px;border-radius:3px;background:currentColor;box-shadow:0 0 0 2px #ffffff99}.status-square.available{background:#d9f6e7;color:#087b4d}.status-square.near{background:#fff0b5;color:#7b6000}.status-square.soon{background:#dcecff;color:#1d69a8}.status-square.reserved{background:#ffe2cc;color:#a95000}.status-square.repair{background:#ffd8d8;color:#ad2222}.video-wrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#f8f4eb}.video-wrap video{width:100%;max-height:330px;border-radius:10px;background:#101820}.chatbox{display:flex;flex-direction:column;gap:10px}.chat-messages{max-height:55vh;overflow:auto;padding:12px;background:#f5f1e9;border-radius:15px}.msg{padding:10px 12px;border-radius:13px;margin:7px 0;max-width:85%;background:#fff;border:1px solid var(--line)}.msg.mine{margin-right:auto;background:#e9f3f0;border-color:#b9d8cf}.msg .meta2{font-size:10px;color:var(--m);margin-bottom:4px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #eee7dc;text-align:right}th{font-size:11px;color:var(--m)}td{font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#07151b99;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--c);border-radius:22px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.timeline{border-right:2px solid #dcd0b7;padding-right:18px}.event{padding-bottom:15px;position:relative}.event:before{content:"";position:absolute;right:-25px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--g)}.event small{color:var(--m)}.notice{padding:11px;border-radius:12px;background:#f2eee6;font-size:12px}.empty{text-align:center;color:var(--m);padding:30px}footer{text-align:center;color:#8b8981;font-size:10px;padding:16px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f5f1e9;aspect-ratio:1/1}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo button{position:absolute;top:5px;left:5px;border:0;border-radius:8px;background:#d63f42;color:#fff;padding:5px 7px}.photoempty{padding:18px;text-align:center;color:var(--m);background:#f5f1e9;border-radius:12px}@media(max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:14px}.top{padding:0 14px}}@media(max-width:600px){.stats,.cards,.formgrid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.toolbar input,.toolbar select{width:100%}.top h2{font-size:17px}}
</style>

<style id="v4-enhancements">
.v4-share{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 11px;background:#b8953f;color:#fff;font-weight:700;cursor:pointer}
.v4-copy{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 11px;background:#1d2942;color:#fff;font-weight:700;cursor:pointer}
.v4-field{min-width:105px}
.v4-details{white-space:pre-wrap;line-height:1.8;background:#f7f5ef;border:1px solid #d8caa3;border-radius:12px;padding:12px}
.v4-count{font-size:12px;font-weight:700;padding:3px 7px;border-radius:999px;background:#eee6cd;color:#57461b}
</style>


<style id="v5-alert-css">
.v5-alert-box{margin:10px 0;padding:12px;border-radius:12px;border:2px solid #c62828;background:#ffebee;color:#9b1c1c;font-weight:800}
.v5-alert-btn{background:#c62828!important;color:#fff!important;border:0!important;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
.v5-alert-days{max-width:130px}
.v5-alert-badge{display:inline-block;background:#c62828;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}
</style>


<style id="final-release-css">
.final-alert-counter{position:sticky;top:8px;z-index:50;margin:10px 0;padding:12px 16px;border-radius:14px;background:#c62828;color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18);font-weight:900;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.final-alert-counter small{font-weight:700;opacity:.95}
.final-alert-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.final-alert-panel{width:min(650px,96vw);max-height:85vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;color:#222}
.final-alert-row{border:1px solid #eee;border-right:5px solid #c62828;border-radius:12px;padding:12px;margin:9px 0}
.final-alert-close{float:left;border:0;background:#eee;border-radius:10px;padding:7px 11px;font-weight:800}
</style>

<style id="final-updates-css">
.final-alert-counter{margin:10px 0;padding:13px 16px;border-radius:14px;background:#c62828;color:#fff;font-weight:900;cursor:pointer;display:flex;justify-content:space-between;gap:10px;box-shadow:0 5px 18px rgba(0,0,0,.15)}
.final-alert-counter small{font-weight:700}.final-alert-row{border:1px solid #eee;border-right:5px solid #c62828;border-radius:12px;padding:12px;margin:9px 0}
.v5-alert-box{margin:10px 0;padding:10px;border-radius:10px;border:2px solid #c62828;background:#ffebee;color:#9b1c1c;font-weight:800;font-size:12px}
</style>
</head>
<body><div id="root"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
let token=localStorage.getItem("wa_token"),me=JSON.parse(localStorage.getItem("wa_me")||"null"),D=null,page="home",search="";
const statuses=["متاحة","قريبة من التوفر","الحجز ينتهي قريباً","مؤجرة / محجوزة","غير متاحة / صيانة"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};if(opt.body&&!opt.headers["Content-Type"])opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}
function login(){ $("root").innerHTML=`<div class="login"><div class="loginbox"><div class="logo">⌂</div><h1>إدارة عقارات غرب عمّان</h1><p class="muted" style="text-align:center">النظام النهائي — هاتف وكمبيوتر</p><div class="demo"><b>تجربة:</b><br>owner / 1234 — مالك<br>admin / 1234 — مدير<br>user / 1234 — عرض فقط</div><div class="field"><label>اسم المستخدم</label><input id="lu" value="owner"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" value="1234"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="doLogin()">تسجيل الدخول</button></div></div>`}
async function doLogin(){try{let j=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:lu.value,password:lp.value})}).then(r=>r.json());if(!j.token)throw Error(j.error);token=j.token;me=j.user;localStorage.setItem("wa_token",token);localStorage.setItem("wa_me",JSON.stringify(me));await load()}catch(e){alert(e.message)}}
async function load(){if(!token)return login();try{D=await api("/api/bootstrap");render()}catch(e){localStorage.clear();token=null;me=null;login()}}
function nav(p){page=p;search="";render()}
function role(){return me.role==="owner"?"المالك":me.role==="admin"?"مسؤول النظام":"مستخدم عادي"}
function shell(){let titles={home:"الرئيسية",apartments:"الشقق والعقارات",tenants:"المستأجرون والعقود",finance:"الدفعات والمالية",users:"المستخدمون والصلاحيات",logs:"سجل العمليات",chat:"محادثة المالك وAdmin"};$("root").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">⌂</div><div><b>عقارات غرب عمّان</b><br><small>نظام الإدارة</small></div></div><div class="nav">
<button class="${page==="home"?"active":""}" onclick="nav('home')">⌂ الرئيسية</button><button class="${page==="apartments"?"active":""}" onclick="nav('apartments')">▦ الشقق</button><button class="${page==="tenants"?"active":""}" onclick="nav('tenants')">♙ المستأجرون</button><button class="${page==="finance"?"active":""}" onclick="nav('finance')">د.أ المالية</button><button class="${page==="users"?"active":""}" onclick="nav('users')">◉ الصلاحيات</button><button class="${page==="logs"?"active":""}" onclick="nav('logs')">◷ السجل</button>${["owner","admin"].includes(me.role)?`<button class="${page==="chat"?"active":""}" onclick="nav('chat')">💬 المحادثة</button>`:""}<button onclick="logout()">↪ خروج</button></div></aside><main class="main"><div class="top"><h2>${titles[page]}</h2><div class="user">${role()} <div class="avatar">${me.role==="owner"?"♛":"●"}</div></div></div><div class="content">${view()}</div><footer>نظام إدارة عقارات غرب عمّان • PWA • SQLite</footer></main></div>`}
function view(){return page==="home"?home():page==="apartments"?apartments():page==="tenants"?tenants():page==="finance"?finance():page==="users"?users():page==="chat"?chat():logs()}
function home(){
 let s=D.stats||{};
 return `<div id="homeAlertCounter"></div><div class="hero"><div><small>نسخة احترافية — كحلي وذهبي</small><h3>مرحباً بك في نظام إدارة عقارات غرب عمّان</h3><p>إدارة الشقق، المستأجرين، العقود، الدفعات، المستندات والصلاحيات.</p></div><button class="btn primary" onclick="nav('apartments')">إدارة العقارات</button></div><div class="stats"><div class="stat"><div class="n">${s.total||0}</div><div class="l">إجمالي الشقق</div></div><div class="stat"><div class="n">${s.available||0}</div><div class="l">متاحة</div></div><div class="stat"><div class="n">${s.soon||0}</div><div class="l">قريبة من التوفر</div></div><div class="stat"><div class="n">${s.rented||0}</div><div class="l">مؤجرة</div></div><div class="stat"><div class="n">${s.repair||0}</div><div class="l">صيانة</div></div><div class="stat"><div class="n">${Number(D.money?.total||0).toLocaleString()}</div><div class="l">دفعات هذا الشهر د.أ</div></div></div><div class="panel"><div class="head"><h3>أحدث الشقق</h3><button class="btn ghost" onclick="nav('apartments')">عرض الكل</button></div><div class="cards">${D.apartments.slice(0,6).map(card).join("")}</div></div><div class="panel"><div class="head"><h3>آخر العمليات</h3><button class="btn ghost" onclick="nav('logs')">السجل</button></div>${D.logs.slice(0,6).map(l=>`<div style="padding:10px 0;border-bottom:1px solid #eee7dc"><b>${esc(l.action)}</b> — ${esc(l.detail)} <small class="muted">${esc(l.created_at)}</small></div>`).join("")||'<div class="empty">لا توجد عمليات</div>'}</div>`;
}
function badge(s){let c=s==="متاحة"?"available":s==="قريبة من التوفر"?"near":s==="الحجز ينتهي قريباً"?"soon":s==="مؤجرة / محجوزة"?"reserved":"repair";return `<span class="status-square ${c}">${esc(s)}</span>`}
function apartmentAlert(a){if(!a.availability_alert_enabled||!a.availability_alert_days||!a.availability_date)return "";let d=new Date(a.availability_date+"T00:00:00"),now=new Date();if(Number.isNaN(d.getTime()))return "";let days=Math.ceil((d-now)/86400000);return days>=0&&days<=Number(a.availability_alert_days)?`<div class="v5-alert-box">🚨 موعد توفر الشقة: ${esc(a.availability_date)} — ${days===0?"متاحة اليوم":`متاحة خلال ${days} يوم`}</div>`:"";}
function card(a){let photos=D.documents.filter(d=>d.apartment_id===a.id&&d.kind==='صورة شقة');let videos=D.documents.filter(d=>d.apartment_id===a.id&&d.kind==='فيديو شقة');let thumb=photos[0]?.filename?`<img src="/uploads/${encodeURIComponent(photos[0].filename)}" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px" alt="صورة الشقة">`:'';let share=me.role==="owner"?`<button class="v4-share" onclick="shareApartment(${a.id})">↗ مشاركة</button>`:"";return `<div class="card">${thumb}<h4>شقة ${esc(a.number)}</h4><div class="meta">${esc(a.area)}<br>${a.rooms||0} غرف • ${a.baths||0} حمام • ${a.living_rooms||0} صالة • ${a.salons||0} صالون • ${a.balconies||0} بلكونة<br>${a.size_m2||0} م² • ${Number(a.rent||0).toLocaleString()} د.أ / شهر • طابق ${a.floor}<br>📷 ${photos.length} صورة ${videos.length?` • 🎥 ${videos.length} فيديو`:""}</div>${apartmentAlert(a)}<div class="row">${badge(a.status)}<span style="display:flex;gap:6px;flex-wrap:wrap">${share}<button class="btn ghost" onclick="editA(${a.id})">تفاصيل</button></span></div></div>`}
function apartments(){return `<div class="panel"><div class="head"><h3>إدارة العقارات</h3>${me.role!=="user"?'<button class="btn primary" onclick="addA()">＋ إضافة شقة</button>':""}</div><div class="toolbar"><input id="aq" placeholder="بحث برقم الشقة أو المنطقة..." oninput="drawA()"><select id="af" onchange="drawA()"><option value="">كل المناطق</option>${D.areas.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select><select id="as" onchange="drawA()"><option value="">كل الحالات</option>${statuses.map(s=>`<option>${s}</option>`).join("")}</select><input id="arooms" class="v4-field" type="number" min="0" placeholder="الغرف" oninput="drawA()"><input id="abaths" class="v4-field" type="number" min="0" placeholder="الحمامات" oninput="drawA()"><input id="aliving" class="v4-field" type="number" min="0" placeholder="الصالات" oninput="drawA()"><input id="asalons" class="v4-field" type="number" min="0" placeholder="الصالونات" oninput="drawA()"><input id="abalconies" class="v4-field" type="number" min="0" placeholder="البلكونات" oninput="drawA()"><button class="btn ghost" onclick="location.href='/api/export/apartments.csv'">تصدير CSV</button></div><div class="notice" style="margin-top:10px">حالة الشقة تظهر بمربع واضح. ويمكنك تحديد موعد التوفر وعدد أيام التنبيه لكل شقة.</div><div id="alist" class="cards" style="margin-top:16px"></div></div><div class="panel"><div class="head"><h3>مناطق غرب عمّان</h3><span class="muted">${D.areas.length} منطقة/حي</span></div><div class="cards">${D.areas.map(a=>`<div class="card"><b>${esc(a.name)}</b><div class="meta">منطقة متاحة للإسناد إلى الشقق</div></div>`).join("")}</div></div>`}
function drawA(){let q=($("aq")?.value||"").toLowerCase(),ar=$("af")?.value||"",st=$("as")?.value||"",rooms=+$("arooms")?.value||0,baths=+$("abaths")?.value||0,living=+$("aliving")?.value||0,salons=+$("asalons")?.value||0,balconies=+$("abalconies")?.value||0;let x=D.apartments.filter(a=>(a.number+" "+a.area).toLowerCase().includes(q)&&(!ar||a.area===ar)&&(!st||a.status===st)&&(!rooms||+a.rooms===rooms)&&(!baths||+a.baths===baths)&&(!living||+a.living_rooms===living)&&(!salons||+a.salons===salons)&&(!balconies||+a.balconies===balconies));$("alist").innerHTML=x.length?x.map(card).join(""):'<div class="empty">لا توجد نتائج</div>'}
function aForm(a={}){return `<div class="formgrid"><div class="field"><label>رقم/كود الشقة</label><input id="an" value="${esc(a.number)}"></div><div class="field"><label>المنطقة</label><select id="aa">${D.areas.map(x=>`<option value="${x.id}" ${(x.id===a.area_id||x.name===a.area)?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>الحالة</label><select id="ast">${statuses.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>الإيجار الشهري (د.أ)</label><input id="ar" type="number" value="${a.rent||0}"></div><div class="field"><label>المساحة (م²)</label><input id="az" type="number" value="${a.size_m2||0}"></div><div class="field"><label>الغرف</label><input id="ro" type="number" min="0" value="${a.rooms||0}"></div><div class="field"><label>الحمامات</label><input id="ba" type="number" min="0" value="${a.baths||0}"></div><div class="field"><label>الصالات</label><input id="li" type="number" min="0" value="${a.living_rooms||0}"></div><div class="field"><label>الصالونات</label><input id="sa" type="number" min="0" value="${a.salons||0}"></div><div class="field"><label>البلكونات</label><input id="bl" type="number" min="0" value="${a.balconies||0}"></div><div class="field"><label>الطابق</label><input id="fl" type="number" value="${a.floor||1}"></div><div class="field"><label>📅 موعد توفر الشقة</label><input id="avd" type="date" value="${esc(a.availability_date||"")}"></div><div class="field"><label>🔔 عدد الأيام قبل التوفر</label><input id="avdays" type="number" min="1" max="365" value="${a.availability_alert_days||7}"></div><div class="field"><label style="display:flex;align-items:center;gap:8px;margin-top:24px"><input id="aven" type="checkbox" ${a.availability_alert_enabled?"checked":""}> تفعيل التنبيه لهذه الشقة</label></div><div class="field full"><label>ملاحظات</label><textarea id="no">${esc(a.notes)}</textarea></div></div>`}
function addA(){modal(`<div class="modalhead"><h3>إضافة شقة جديدة</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div>${aForm()}<button class="btn primary" style="margin-top:14px" onclick="saveA()">حفظ</button>`)}
function editA(id){let a=D.apartments.find(x=>x.id===id);let photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة');let videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='فيديو شقة');modal(`<div class="modalhead"><h3>الشقة ${esc(a.number)} — التفاصيل الكاملة</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div><div class="v4-details">الكود: ${esc(a.number)}\nالمنطقة: ${esc(a.area)}\nالحالة: ${esc(a.status)}\nالغرف: ${a.rooms||0} | الحمامات: ${a.baths||0}\nالصالات: ${a.living_rooms||0} | الصالونات: ${a.salons||0} | البلكونات: ${a.balconies||0}\nالمساحة: ${a.size_m2||0} م² | الطابق: ${a.floor||0}\nالإيجار: ${Number(a.rent||0).toLocaleString()} د.أ / شهر\nموعد التوفر: ${a.availability_date||"غير محدد"}\nالملاحظات: ${a.notes||"—"}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="v4-copy" onclick="copyApartmentDetails(${id})">📋 نسخ التفاصيل</button>${me.role==="owner"?`<button class="v4-share" onclick="shareApartment(${id})">↗ مشاركة خارج التطبيق</button>`:""}</div>${aForm(a)}<div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>📷 صور الشقة</h3><span class="muted">${photos.length} صورة • اختر عدة صور مرة واحدة (حتى 30 صورة)</span></div>${me.role!=="user"?`<input id="apPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadApartmentPhotos(${id})">`:""}<div id="photos_${id}" class="photos">${photos.length?photos.map(photoHtml).join(""):'<div class="photoempty full">لا توجد صور لهذه الشقة</div>'}</div></div><div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>🎥 فيديو الشقة</h3><span class="muted">${videos.length} فيديو</span></div>${me.role!=="user"?`<input id="apVideo" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v" onchange="uploadApartmentVideo(${id})">`:""}${videos.length?videos.map(videoHtml).join(""):'<div class="photoempty">لا يوجد فيديو لهذه الشقة</div>'}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" onclick="saveA(${id})">حفظ التعديلات</button>${me.role==="owner"?`<button class="btn danger" onclick="delA(${id})">حذف الشقة</button>`:""}</div>`)}
function photoHtml(d){return `<div class="photo"><img src="/uploads/${encodeURIComponent(d.filename)}" alt="${esc(d.original_name)}"><button onclick="deletePhoto(${d.id})">حذف</button></div>`}
function videoHtml(d){return `<div class="video-wrap"><video controls preload="metadata" src="/uploads/${encodeURIComponent(d.filename)}"></video><div class="row"><span class="muted">${esc(d.original_name)}</span><button class="btn danger" onclick="deleteVideo(${d.id},${d.apartment_id})">حذف</button></div></div>`}
async function uploadApartmentPhotos(id){try{let input=$("apPhotos");if(!input.files.length)return;let fd=new FormData();[...input.files].forEach(f=>fd.append("photos",f));let r=await fetch("/api/apartments/"+id+"/photos",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"فشل رفع الصور");alert("تم رفع الصور بنجاح");await load();editA(id)}catch(e){alert(e.message)}}
async function uploadApartmentVideo(id){try{let input=$("apVideo");if(!input.files.length)return;let fd=new FormData();fd.append("video",input.files[0]);let r=await fetch("/api/apartments/"+id+"/video",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"فشل رفع الفيديو");alert("تم رفع الفيديو بنجاح");await load();editA(id)}catch(e){alert(e.message)}}
async function deletePhoto(id){if(!confirm("حذف هذه الصورة؟"))return;try{let d=D.documents.find(x=>x.id===id);await api("/api/documents/"+id,{method:"DELETE"});await load();if(d)editA(d.apartment_id);else closeM()}catch(e){alert(e.message)}}
async function deleteVideo(id,apartmentId){if(!confirm("حذف فيديو الشقة؟"))return;try{await api("/api/documents/"+id,{method:"DELETE"});await load();editA(apartmentId)}catch(e){alert(e.message)}}
async function saveA(id){try{let b={number:an.value,area_id:+aa.value,status:ast.value,rent:+ar.value,size_m2:+az.value,rooms:+ro.value,baths:+ba.value,living_rooms:+li.value,salons:+sa.value,balconies:+bl.value,kitchen:1,floor:+fl.value,notes:no.value,availability_date:avd.value,availability_alert_days:+avdays.value||0,availability_alert_enabled:aven.checked};await api(id?"/api/apartments/"+id:"/api/apartments",{method:id?"PUT":"POST",body:JSON.stringify(b)});closeM();await load()}catch(e){alert(e.message)}}
function tenants(){return `<div class="panel"><div class="head"><h3>المستأجرون والعقود</h3>${me.role!=="user"?'<button class="btn primary" onclick="addT()">＋ إضافة مستأجر</button>':""}</div><table><thead><tr><th>المستأجر</th><th>الشقة</th><th>الهاتف</th><th>الإيجار</th><th>بداية العقد</th><th>نهاية العقد</th><th>الحالة</th></tr></thead><tbody>${D.tenants.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.apartment||"—")}</td><td>${esc(t.phone)}</td><td>${Number(t.monthly_rent||0).toLocaleString()}</td><td>${esc(t.contract_start||"—")}</td><td>${esc(t.contract_end||"—")}</td><td>${badge(t.status)}</td></tr>`).join("")||'<tr><td colspan="7" class="empty">لا يوجد مستأجرون</td></tr>'}</tbody></table></div>`}
function addT(){modal(`<div class="modalhead"><h3>إضافة مستأجر وعقد</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div><div class="formgrid"><div class="field"><label>الاسم</label><input id="tn"></div><div class="field"><label>الهاتف</label><input id="tp"></div><div class="field"><label>رقم الهوية</label><input id="tid"></div><div class="field"><label>الشقة</label><select id="ta"><option value="">بدون</option>${D.apartments.map(a=>`<option value="${a.id}">${a.number} — ${a.area}</option>`).join("")}</select></div><div class="field"><label>بداية العقد</label><input id="cs" type="date"></div><div class="field"><label>نهاية العقد</label><input id="ce" type="date"></div><div class="field"><label>الإيجار الشهري</label><input id="tr" type="number"></div><div class="field"><label>التأمين</label><input id="dep" type="number"></div><div class="field full"><label>ملاحظات</label><textarea id="tnote"></textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveT()">حفظ</button>`)}
async function saveT(){try{await api("/api/tenants",{method:"POST",body:JSON.stringify({name:tn.value,phone:tp.value,national_id:tid.value,apartment_id:ta.value?+ta.value:null,contract_start:cs.value,contract_end:ce.value,monthly_rent:+tr.value,deposit:+dep.value,status:"نشط",notes:tnote.value})});closeM();await load()}catch(e){alert(e.message)}}
function finance(){return `<div class="panel"><div class="head"><h3>الدفعات والتحصيل</h3>${me.role!=="user"?'<button class="btn primary" onclick="addP()">＋ تسجيل دفعة</button>':""}</div><div class="stats"><div class="stat"><div class="n">${Number(D.money?.total||0).toLocaleString()}</div><div class="l">إجمالي دفعات الشهر د.أ</div></div></div><table><thead><tr><th>التاريخ</th><th>المستأجر</th><th>المبلغ</th><th>الطريقة</th><th>المرجع</th></tr></thead><tbody>${D.payments.map(p=>`<tr><td>${esc(p.payment_date)}</td><td>${esc(p.tenant||"—")}</td><td><b>${Number(p.amount).toLocaleString()} د.أ</b></td><td>${esc(p.method)}</td><td>${esc(p.reference||"—")}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">لا توجد دفعات</td></tr>'}</tbody></table></div>`}
function addP(){modal(`<div class="modalhead"><h3>تسجيل دفعة</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div><div class="formgrid"><div class="field"><label>المستأجر</label><select id="pt">${D.tenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></div><div class="field"><label>المبلغ</label><input id="pa" type="number" step="0.01"></div><div class="field"><label>التاريخ</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>طريقة الدفع</label><select id="pm"><option>نقدي</option><option>تحويل بنكي</option><option>إي فواتيركم</option><option>شيك</option></select></div><div class="field"><label>المرجع</label><input id="pr"></div><div class="field full"><label>ملاحظات</label><textarea id="pn"></textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveP()">حفظ</button>`)}
async function saveP(){try{await api("/api/payments",{method:"POST",body:JSON.stringify({tenant_id:+pt.value,amount:+pa.value,payment_date:pd.value,method:pm.value,reference:pr.value,notes:pn.value})});closeM();await load()}catch(e){alert(e.message)}}
function chat(){if(!["owner","admin"].includes(me.role))return '<div class="empty">المحادثة متاحة للمالك وAdmin فقط</div>';return `<div class="panel"><div class="head"><div><h3>💬 محادثة داخلية</h3><span class="muted">محادثة خاصة بين المالك وAdmin</span></div><button class="btn ghost" onclick="loadChat()">↻ تحديث</button></div><div id="chatMessages" class="chat-messages"><div class="empty">جاري تحميل الرسائل...</div></div><div class="chatbox" style="margin-top:12px"><textarea id="chatInput" rows="3" maxlength="2000" placeholder="اكتب رسالتك للمالك أو Admin..."></textarea><button class="btn primary" onclick="sendChat()">إرسال الرسالة</button></div></div>`}
async function loadChat(){try{let r=await fetch("/api/messages",{headers:{Authorization:"Bearer "+token}});let j=await r.json();if(!r.ok)throw Error(j.error||"فشل تحميل المحادثة");let box=$("chatMessages");if(!box)return;box.innerHTML=j.length?j.map(m=>`<div class="msg ${m.sender_username===me.username?"mine":""}"><div class="meta2">${esc(m.sender_username)} • ${esc(m.created_at)}</div><div>${esc(m.message)}</div></div>`).join(""):'<div class="empty">لا توجد رسائل بعد</div>';box.scrollTop=box.scrollHeight}catch(e){let box=$("chatMessages");if(box)box.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function sendChat(){let input=$("chatInput");let message=(input?.value||"").trim();if(!message)return;try{await api("/api/messages",{method:"POST",body:JSON.stringify({message})});input.value="";await loadChat()}catch(e){alert(e.message)}}
function users(){return `<div class="panel"><div class="head"><h3>المستخدمون والصلاحيات</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${me.role==="owner"?'<button class="btn primary" onclick="addU()">＋ مستخدم</button>':""}<button class="btn dark" onclick="changePassword()">🔐 تغيير كلمة المرور</button></div></div><div class="cards"><div class="card"><h4>المالك</h4><div class="meta">إدارة كاملة + حذف + مستخدمين</div></div><div class="card"><h4>Admin</h4><div class="meta">إضافة وتعديل بدون حذف</div></div><div class="card"><h4>User</h4><div class="meta">عرض وبحث فقط</div></div></div><div class="notice" style="margin-top:14px">يمكن لكل مستخدم تغيير كلمة مرور حسابه من هنا. استخدم كلمة مرور قوية ولا تشاركها.</div></div>`}
function changePassword(){modal(`<div class="modalhead"><h3>تغيير كلمة المرور</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div><div class="notice">الحساب الحالي: <b>${esc(me.username)}</b></div><div class="field"><label>كلمة المرور الحالية</label><input id="cp" type="password" autocomplete="current-password"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="np" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="np2" type="password" minlength="6" autocomplete="new-password"></div><button class="btn primary" onclick="savePassword()">حفظ كلمة المرور</button>`)}
async function savePassword(){try{if(np.value!==np2.value)throw Error("كلمتا المرور الجديدتان غير متطابقتين");if(np.value.length<6)throw Error("كلمة المرور الجديدة يجب أن تكون 6 أحرف/أرقام على الأقل");await api("/api/change-password",{method:"POST",body:JSON.stringify({currentPassword:cp.value,newPassword:np.value})});closeM();alert("تم تغيير كلمة المرور بنجاح. استخدمها في تسجيل الدخول القادم.")}catch(e){alert(e.message)}}

function addU(){modal(`<div class="modalhead"><h3>إضافة مستخدم</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div><div class="field"><label>اسم المستخدم</label><input id="un"></div><div class="field"><label>كلمة المرور</label><input id="up" type="password"></div><div class="field"><label>الصلاحية</label><select id="ur"><option value="admin">Admin</option><option value="user">User</option><option value="owner">Owner</option></select></div><button class="btn primary" onclick="saveU()">حفظ</button>`)}
async function saveU(){try{await api("/api/users",{method:"POST",body:JSON.stringify({username:un.value,password:up.value,role:ur.value})});closeM();alert("تم إنشاء المستخدم")}catch(e){alert(e.message)}}
function logs(){return `<div class="panel"><div class="head"><h3>سجل العمليات</h3></div><div class="timeline">${D.logs.map(l=>`<div class="event"><b>${esc(l.action)}</b> — ${esc(l.detail)}<br><small>${esc(l.created_at)} • ${esc(l.who)}</small></div>`).join("")||'<div class="empty">لا توجد عمليات</div>'}</div></div>`}
function modal(x){$("modalbox").innerHTML=x;$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}function logout(){localStorage.clear();token=null;me=null;login()}
function render(){shell();if(page==="apartments")drawA();if(page==="chat")loadChat();if(page==="home")setTimeout(loadAlertCounter,0)}

async function copyApartmentDetails(id){try{let a=D.apartments.find(x=>x.id===id),photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==="صورة شقة"),videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==="فيديو شقة");let text=`🏠 شقة ${a.number}
المنطقة: ${a.area}
الحالة: ${a.status}
الغرف: ${a.rooms||0} | الحمامات: ${a.baths||0}
الصالات: ${a.living_rooms||0} | الصالونات: ${a.salons||0} | البلكونات: ${a.balconies||0}
المساحة: ${a.size_m2||0} م²
الإيجار: ${Number(a.rent||0).toLocaleString()} د.أ / شهر
موعد التوفر: ${a.availability_date||"غير محدد"}
الصور: ${photos.length} | الفيديو: ${videos.length}
${a.notes||""}`;await navigator.clipboard.writeText(text);alert("تم نسخ تفاصيل الشقة بالكامل.")}catch(e){alert("تعذر النسخ.")}}
async function shareApartment(id){if(me.role!=="owner"){alert("زر المشاركة متاح للمالك فقط.");return}try{let r=await api("/api/apartments/"+id+"/share"),a=r.apartment,base=location.origin,photoLinks=r.photos.map(x=>base+x.url).join("\n"),videoLinks=r.videos.map(x=>base+x.url).join("\n"),text=`🏠 شقة ${a.number}
المنطقة: ${a.area}
الحالة: ${a.status}
الغرف: ${a.rooms||0} | الحمامات: ${a.baths||0}
الصالات: ${a.living_rooms||0} | الصالونات: ${a.salons||0} | البلكونات: ${a.balconies||0}
المساحة: ${a.size_m2||0} م²
الإيجار: ${Number(a.rent||0).toLocaleString()} د.أ / شهر
موعد التوفر: ${a.availability_date||"غير محدد"}
${a.notes||""}
${photoLinks?`📷 صور الشقة:\n${photoLinks}`:""}
${videoLinks?`🎥 فيديو الشقة:\n${videoLinks}`:""}`;if(navigator.share)await navigator.share({title:`شقة ${a.number}`,text});else{await navigator.clipboard.writeText(text);alert("تم نسخ التفاصيل وروابط الصور والفيديو.")}}catch(e){if(e.name!=="AbortError")alert("تعذرت المشاركة.")}}
async function loadAlertCounter(){if(!["owner","admin"].includes(me?.role))return;try{let d=await api("/api/availability-dashboard"),box=$("homeAlertCounter");if(!box)return;if(!d.count){box.innerHTML="";return}box.innerHTML=`<div class="final-alert-counter" onclick='openAlertList(${JSON.stringify(d.alerts)})'><span>🔴 ${d.count} ${d.count===1?"شقة ستصبح متاحة قريبًا":"شقق ستصبح متاحة قريبًا"}</span><small>اضغط لعرض القائمة</small></div>`}catch(e){}}
