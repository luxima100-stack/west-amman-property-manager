<style>
:root{--n:#102f3b;--n2:#0a222c;--g:#c8a45d;--g2:#ead59f;--bg:#f5f1e9;--c:#fffdf8;--t:#17262d;--m:#73818a;--line:#e7dfd1;--ok:#159a68;--bad:#d63f42;--blue:#277fd4;--orange:#ed8a1c;--shadow:0 12px 32px #09202b12}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#d7bc7350,transparent 28%),linear-gradient(135deg,#071923,#174654)}.loginbox{width:min(440px,92%);background:var(--c);border-radius:28px;padding:30px;box-shadow:0 28px 80px #0007}.logo{width:55px;height:55px;border-radius:16px;border:1px solid var(--g);background:var(--n);color:var(--g2);display:grid;place-items:center;margin:auto;font-size:27px}.loginbox h1{text-align:center;font-size:23px}.muted{color:var(--m)}.demo{background:#f1e9da;color:#6d5935;padding:12px;border-radius:13px;font-size:12px;line-height:1.8}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd4c5;border-radius:11px;background:#fff;outline:none}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700}.primary{background:var(--g);color:#17252b}.dark{background:var(--n);color:#fff}.ghost{background:#f0ece4;color:var(--t)}.danger{background:var(--bad);color:#fff}.success{background:var(--ok);color:#fff}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--n),var(--n2));color:#fff;padding:19px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:8px 4px 19px;border-bottom:1px solid #fff2}.brand .logo{margin:0;width:43px;height:43px;background:transparent}.brand b{font-size:15px}.brand small{color:#b9c6ca}.nav{padding-top:15px}.nav button{display:block;width:100%;background:transparent;border:0;color:#dce5e8;text-align:right;padding:12px;border-radius:12px;margin:2px 0}.nav button:hover,.nav button.active{background:#c8a45d1c;color:#fff;border-right:3px solid var(--g)}.main{min-width:0}.top{height:73px;background:#fffdf8ee;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}.top h2{font-size:20px;margin:0}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:var(--g2)}.content{padding:24px;max-width:1550px;margin:auto}.hero{border-radius:24px;background:linear-gradient(135deg,#123946,#0a202a 65%,#362c1b);color:#fff;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:var(--shadow)}.hero h3{font-size:27px;margin:6px 0}.hero small{color:var(--g2);font-weight:700}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin:17px 0}.stat,.panel{background:var(--c);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:15px}.stat .n{font-size:28px;font-weight:800}.stat .l{font-size:11px;color:var(--m)}.panel{padding:19px;margin-bottom:17px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.head h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd4c5;border-radius:10px;background:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.card h4{margin:0 0 7px}.meta{font-size:12px;line-height:1.9;color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700}.available{background:#dcf5e8;color:#087b4d}.near{background:#fff2bf;color:#866500}.soon{background:#dcecff;color:#1d69a8}.reserved{background:#ffe5cf;color:#a95000}.repair{background:#ffdcdc;color:#ad2222}.status-square{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid transparent}.status-square:before{content:"";width:11px;height:11px;border-radius:3px;background:currentColor;box-shadow:0 0 0 2px #ffffff99}.status-square.available{background:#d9f6e7;color:#087b4d}.status-square.near{background:#fff0b5;color:#7b6000}.status-square.soon{background:#dcecff;color:#1d69a8}.status-square.reserved{background:#ffe2cc;color:#a95000}.status-square.repair{background:#ffd8d8;color:#ad2222}.video-wrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#f8f4eb}.video-wrap video{width:100%;max-height:330px;border-radius:10px;background:#101820}.chatbox{display:flex;flex-direction:column;gap:10px}.chat-messages{max-height:55vh;overflow:auto;padding:12px;background:#f5f1e9;border-radius:15px}.msg{padding:10px 12px;border-radius:13px;margin:7px 0;max-width:85%;background:#fff;border:1px solid var(--line)}.msg.mine{margin-right:auto;background:#e9f3f0;border-color:#b9d8cf}.msg .meta2{font-size:10px;color:var(--m);margin-bottom:4px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #eee7dc;text-align:right}th{font-size:11px;color:var(--m)}td{font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#07151b99;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--c);border-radius:22px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.timeline{border-right:2px solid #dcd0b7;padding-right:18px}.event{padding-bottom:15px;position:relative}.event:before{content:"";position:absolute;right:-25px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--g)}.event small{color:var(--m)}.notice{padding:11px;border-radius:12px;background:#f2eee6;font-size:12px}.empty{text-align:center;color:var(--m);padding:30px}footer{text-align:center;color:#8b8981;font-size:10px;padding:16px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f5f1e9;aspect-ratio:1/1}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo button{position:absolute;top:5px;left:5px;border:0;border-radius:8px;background:#d63f42;color:#fff;padding:5px 7px}.photoempty{padding:18px;text-align:center;color:var(--m);background:#f5f1e9;border-radius:12px}@media(max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:14px}.top{padding:0 14px}}@media(max-width:600px){.stats,.cards,.formgrid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.toolbar input,.toolbar select{width:100%}.top h2{font-size:17px}}

<body><div id="root"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
let token=localStorage.getItem("wa_token"),me=JSON.parse(localStorage.getItem("wa_me")||"null"),D=null,page="home",search="";
const statuses=["متاحة","قريبة من التوفر","الحجز ينتهي قريباً","مؤجرة / محجوزة","غير متاحة / صيانة"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};if(opt.body&&!opt.headers["Content-Type"])opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}
function login(){ $("root").innerHTML=`<div class="login"><div class="loginbox"><div class="logo">⌂</div><h1>إدارة عقارات غرب عمّان</h1><p class="muted" style="text-align:center">النظام النهائي — هاتف وكمبيوتر</p><div class="demo"><b>تجربة:</b><br>owner / 1234 — مالك<br>admin / 1234 — مدير<br>user / 1234 — عرض فقط</div><div class="field"><label>اسم المستخدم</label><input id="lu" value="owner"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" value="1234"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="doLogin()">تسجيل الدخول</button></div></div>`}
async function doLogin(){try{let j=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:lu.value,password:lp.value})}).then(r=>r.json());if(!j.token)throw Error(j.error);token=j.token;me=j.user;localStorage.setItem("wa_token",token);localStorage.setItem("wa_me",JSON.stringify(me));await load()}catch(e){alert(e.message)}}
async function load(){if(!token)return login();try{D=await api("/api/bootstrap");render()}catch(e){localStorage.clear();token=null;me=null;login()}}
function nav(p){page=p;search="";render()}
function role(){return me.role==="owner"?"المالك":me.role==="admin"?"مسؤول النظام":"مستخدم عادي"}
function shell(){let titles={home:"الرئيسية",apartments:"الشقق والعقارات",tenants:"المستأجرون والعقود",finance:"الدفعات والمالية",users:"المستخدمون والصلاحيات",logs:"سجل العمليات",chat:"محادثة المالك وAdmin"};$("root").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">⌂</div><div><b>عقارات غرب عمّان</b><br><small>نظام الإدارة</small></div></div><div class="nav">
<button class="${page==="home"?"active":""}" onclick="nav('home')">⌂ الرئيسية</button><button class="${page==="apartments"?"active":""}" onclick="nav('apartments')">▦ الشقق</button><button class="${page==="tenants"?"active":""}" onclick="nav('tenants')">♙ المستأجرون</button><button class="${page==="finance"?"active":""}" onclick="nav('finance')">د.أ المالية</button><button class="${page==="users"?"active":""}" onclick="nav('users')">◉ الصلاحيات</button><button class="${page==="logs"?"active":""}" onclick="nav('logs')">◷ السجل</button>${["owner","admin"].includes(me.role)?`<button class="${page==="chat"?"active":""}" onclick="nav('chat')">💬 المحادثة</button>`:""}<button onclick="logout()">↪ خروج</button></div></aside><main class="main"><div class="top"><h2>${titles[page]}</h2><div class="user">${role()} <div class="avatar">${me.role==="owner"?"♛":"●"}</div></div></div><div class="content">${view()}</div><footer>نظام إدارة عقارات غرب عمّان • PWA • SQLite</footer></main></div>`}
function view(){return page==="home"?home():page==="apartments"?apartments():page==="tenants"?tenants():page==="finance"?finance():page==="users"?users():page==="chat"?chat():logs()}

async function shareMediaFiles(id, kind){
  try{
    if(me?.role!=="owner"){alert("المشاركة متاحة للمالك فقط");return;}
    const docs=D.documents.filter(d=>d.apartment_id===id && d.kind===kind);
    if(!docs.length){alert(kind==="صورة شقة"?"لا توجد صور لهذه الشقة":"لا يوجد فيديو لهذه الشقة");return;}

    const files=[];
    for(const d of docs){
      const r=await fetch("/uploads/"+encodeURIComponent(d.filename),{credentials:"same-origin"});
      if(!r.ok) continue;
      const blob=await r.blob();
      let type=blob.type;
      if(!type){
        const ext=(d.filename||"").toLowerCase().split(".").pop();
        type=kind==="صورة شقة" ? (ext==="png"?"image/png":ext==="webp"?"image/webp":"image/jpeg")
                               : (ext==="webm"?"video/webm":"video/mp4");
      }
      files.push(new File([blob],d.original_name||d.filename,{type}));
    }
    if(!files.length) throw Error("لم يتم تجهيز الملفات");

    if(navigator.share && navigator.canShare && navigator.canShare({files})){
      await navigator.share({
        title: kind==="صورة شقة" ? "صور الشقة" : "فيديو الشقة",
        files
      });
      return;
    }

    // Fallback: open the first media so the user can use the device's share menu.
    const u=URL.createObjectURL(files[0]);
    const a=document.createElement("a"); a.href=u; a.download=files[0].name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
    alert("متصفحك لا يدعم مشاركة الوسائط مباشرة. تم تجهيز الملف الأول للمشاركة من الجهاز.");
  }catch(e){
    if(e?.name==="AbortError") return;
    console.error(e);
    alert("تعذر مشاركة الوسائط. تأكد من السماح للمتصفح بالمشاركة ثم جرّب مرة أخرى.");
  }
}
async function shareApartmentPhotos(id){return shareMediaFiles(id,"صورة شقة")}
async function shareApartmentVideo(id){return shareMediaFiles(id,"فيديو شقة")}

async function shareApartmentDetails(id){
  try{
    if(me?.role!=="owner"){alert("المشاركة متاحة للمالك فقط");return;}
    const a=D.apartments.find(x=>x.id===id);
    if(!a) throw Error("الشقة غير موجودة");

    const lines=detailsLinesForApartment(a);
    const width=1200, pad=70, lineH=62, headerH=135;
    const height=headerH + 80 + lines.length*lineH + 70;
    const canvas=document.createElement("canvas");
    canvas.width=width; canvas.height=height;
    const c=canvas.getContext("2d");
    c.fillStyle="#f7f3e9"; c.fillRect(0,0,width,height);

    // Header.
    c.fillStyle="#102f3b";
    c.roundRect(35,35,width-70,headerH-20,24); c.fill();
    c.fillStyle="#d7b35a";
    c.font="700 30px sans-serif"; c.textAlign="right"; c.direction="rtl";
    c.fillText("تفاصيل الشقة",width-pad,82);
    c.fillStyle="#fff";
    c.font="700 38px sans-serif";
    c.fillText(`شقة ${a.number||""}`,width-pad,128);

    // Details box.
    const boxY=headerH+45;
    c.fillStyle="#fff";
    c.roundRect(35,boxY,width-70,lines.length*lineH+45,20); c.fill();
    c.strokeStyle="#d8caa3"; c.lineWidth=2; c.stroke();

    c.fillStyle="#253238";
    c.font="500 28px sans-serif";
    c.textAlign="right"; c.direction="rtl";
    const statusColor = a.status==="متاحة" ? "#1b8f5a" : (a.status==="صيانة" ? "#c62828" : "#b8953f");
    c.fillStyle=statusColor;
    c.roundRect(75,boxY+22,260,48,18); c.fill();
    c.fillStyle="#fff"; c.font="700 24px sans-serif"; c.textAlign="center";
    c.fillText(a.status||"غير محدد",205,boxY+55);
    c.fillStyle="#253238"; c.font="500 28px sans-serif"; c.textAlign="right"; c.direction="rtl";
    lines.forEach((line,i)=>{
      const y=boxY+55+i*lineH;
      c.fillText(line,width-pad,y);
    });

    // Footer.
    c.fillStyle="#6c6558"; c.font="500 22px sans-serif";
    c.fillText("إدارة عقارات غرب عمّان",width-pad,height-28);

    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png",1));
    if(!blob) throw Error("تعذر إنشاء الصورة");
    const file=new File([blob],`تفاصيل-الشقة-${a.number||id}.png`,{type:"image/png"});

    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title:`تفاصيل شقة ${a.number||""}`,files:[file]});
    }else{
      const u=URL.createObjectURL(file);
      const aEl=document.createElement("a"); aEl.href=u; aEl.download=file.name; aEl.click();
      setTimeout(()=>URL.revokeObjectURL(u),1000);
      alert("تم إنشاء صورة التفاصيل. شارك الصورة من معرض الهاتف.");
    }
  }catch(e){
    if(e?.name==="AbortError") return;
    console.error(e);
    alert("تعذر إنشاء صورة التفاصيل.");
  }
}

function openMiniVideo(id){
  const videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==="فيديو شقة");
  if(!videos.length){alert("لا يوجد فيديو لهذه الشقة");return;}
  const p=videos[0];
  const box=document.createElement("div");
  box.className="v55-video-modal";
  box.innerHTML=`
    <div class="v55-video-panel">
      <button class="v55-video-close" aria-label="إغلاق">×</button>
      <div class="v55-video-title">🎥 فيديو الشقة</div>
      <video class="v55-mini-video" controls autoplay playsinline preload="metadata"
        src="/uploads/${encodeURIComponent(p.filename)}"></video>
    </div>`;
  document.body.appendChild(box);
  const v=box.querySelector("video");
  box.querySelector(".v55-video-close").onclick=()=>{v.pause();box.remove()};
  box.onclick=e=>{if(e.target===box){v.pause();box.remove()}};
}

function openApartmentGallery(apartmentId,index){
  const photos=D.documents.filter(d=>d.apartment_id===apartmentId&&d.kind==="صورة شقة");
  if(!photos.length)return;
  let i=Math.max(0,Math.min(index||0,photos.length-1));
  const box=document.createElement("div");
  box.className="v55-gallery";
  box.innerHTML=`
    <div class="v55-gallery-box">
      <button class="v55-gallery-close" aria-label="إغلاق">×</button>
      <button class="v55-gallery-prev" aria-label="الصورة السابقة">›</button>
      <img class="v55-gallery-img" alt="صورة الشقة">
      <button class="v55-gallery-next" aria-label="الصورة التالية">‹</button>
      <div class="v55-gallery-count"></div>
    </div>`;
  document.body.appendChild(box);
  const img=box.querySelector(".v55-gallery-img");
  const count=box.querySelector(".v55-gallery-count");
  const render=()=>{
    const p=photos[i];
    img.src="/uploads/"+encodeURIComponent(p.filename);
    img.alt=p.original_name||"صورة الشقة";
    count.textContent=`${i+1} / ${photos.length}`;
  };
  const next=()=>{i=(i+1)%photos.length;render()};
  const prev=()=>{i=(i-1+photos.length)%photos.length;render()};
  box.querySelector(".v55-gallery-close").onclick=()=>box.remove();
  box.querySelector(".v55-gallery-next").onclick=next;
  box.querySelector(".v55-gallery-prev").onclick=prev;
  box.onclick=e=>{if(e.target===box)box.remove()};
  document.addEventListener("keydown",function handler(e){
    if(!document.body.contains(box)){document.removeEventListener("keydown",handler);return}
    if(e.key==="Escape"){box.remove();document.removeEventListener("keydown",handler)}
    if(e.key==="ArrowLeft")next();
    if(e.key==="ArrowRight")prev();
  });
  let sx=null;
  img.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  img.addEventListener("touchend",e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40)(dx<0?next:prev)();
    sx=null;
  },{passive:true});
  render();
}

async function uploadApartmentPhotos(id){try{let input=$("apPhotos");if(!input.files.length)return;let fd=new FormData();[...input.files].forEach(f=>fd.append("photos",f));let r=await fetch("/api/apartments/"+id+"/photos",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"فشل رفع الصور");alert("تم رفع الصور بنجاح");await load();editA(id)}catch(e){alert(e.message)}}
async function uploadApartmentVideo(id){try{let input=$("apVideo");if(!input.files.length)return;let fd=new FormData();fd.append("video",input.files[0]);let r=await fetch("/api/apartments/"+id+"/video",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"فشل رفع الفيديو");alert("تم رفع الفيديو بنجاح");await load();editA(id)}catch(e){alert(e.message)}}
async function deletePhoto(id){if(!confirm("حذف هذه الصورة؟"))return;try{let d=D.documents.find(x=>x.id===id);await api("/api/documents/"+id,{method:"DELETE"});await load();if(d)editA(d.apartment_id);else closeM();}catch(e){alert(e.message)}}
async function deleteVideo(id,apartmentId){if(!confirm("حذف فيديو الشقة؟"))return;try{await api("/api/documents/"+id,{method:"DELETE"});await load();editA(apartmentId)}catch(e){alert(e.message)}}

async function shareFilesForApartment(id, kind){
  try{
    if(me?.role!=="owner"){alert("المشاركة متاحة للمالك فقط");return;}
    const a=D.apartments.find(x=>x.id===id);
    if(!a) throw Error("الشقة غير موجودة");
    let docs=[];
    let title="";
    if(kind==="photos"){
      docs=D.documents.filter(d=>d.apartment_id===id&&d.kind==="صورة شقة");
      title=`صور شقة ${a.number}`;
      if(!docs.length){alert("لا توجد صور لهذه الشقة");return;}
    }else if(kind==="video"){
      docs=D.documents.filter(d=>d.apartment_id===id&&d.kind==="فيديو شقة");
      title=`فيديو شقة ${a.number}`;
      if(!docs.length){alert("لا يوجد فيديو لهذه الشقة");return;}
    }

    if(!navigator.share){
      const links=docs.map(d=>location.origin+"/uploads/"+encodeURIComponent(d.filename));
      await navigator.clipboard.writeText(links.join("\\n"));
      alert("تم نسخ روابط الملفات. متصفحك لا يدعم مشاركة الملفات مباشرة.");
      return;
    }

    const files=[];
    for(const d of docs){
      const r=await fetch("/uploads/"+encodeURIComponent(d.filename),{credentials:"same-origin"});
      if(!r.ok) continue;
      const blob=await r.blob();
      const fallbackType=kind==="video"?"video/mp4":"image/jpeg";
      files.push(new File([blob],d.original_name||d.filename,{type:blob.type||fallbackType}));
    }

    if(files.length && navigator.canShare && navigator.canShare({files})){
      await navigator.share({title,files});
    }else{
      const links=docs.map(d=>location.origin+"/uploads/"+encodeURIComponent(d.filename));
      await navigator.share({title,text:links.join("\\n")});
    }
  }catch(e){
    if(e?.name==="AbortError") return;
    alert("تعذر مشاركة الملف. جرّب مرة أخرى.");
  }
}

function openApartmentGallery(apartmentId,index){
  const photos=D.documents.filter(d=>d.apartment_id===apartmentId&&d.kind==="صورة شقة");
  if(!photos.length)return;
  let i=Math.max(0,Math.min(index||0,photos.length-1));
  const box=document.createElement("div");
  box.className="v55-gallery";
  box.innerHTML=`
    <div class="v55-gallery-box">
      <button class="v55-gallery-close" aria-label="إغلاق">×</button>
      <button class="v55-gallery-prev" aria-label="الصورة السابقة">›</button>
      <img class="v55-gallery-img" alt="صورة الشقة">
      <button class="v55-gallery-next" aria-label="الصورة التالية">‹</button>
      <div class="v55-gallery-count"></div>
    </div>`;
  document.body.appendChild(box);
  const img=box.querySelector(".v55-gallery-img");
  const count=box.querySelector(".v55-gallery-count");
  const render=()=>{
    const p=photos[i];
    img.src="/uploads/"+encodeURIComponent(p.filename);
    img.alt=p.original_name||"صورة الشقة";
    count.textContent=`${i+1} / ${photos.length}`;
  };
  const next=()=>{i=(i+1)%photos.length;render()};
  const prev=()=>{i=(i-1+photos.length)%photos.length;render()};
  box.querySelector(".v55-gallery-close").onclick=()=>box.remove();
  box.querySelector(".v55-gallery-next").onclick=next;
  box.querySelector(".v55-gallery-prev").onclick=prev;
  box.onclick=e=>{if(e.target===box)box.remove()};
  document.addEventListener("keydown",function handler(e){
    if(!document.body.contains(box)){document.removeEventListener("keydown",handler);return}
    if(e.key==="Escape"){box.remove();document.removeEventListener("keydown",handler)}
    if(e.key==="ArrowLeft")next();
    if(e.key==="ArrowRight")prev();
  });
  let sx=null;
  img.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  img.addEventListener("touchend",e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40)(dx<0?next:prev)();
    sx=null;
  },{passive:true});
  render();
}

<script id="v4-enhancements-js">
/* v4: Rooms, bathrooms, living room/salon/balcony + owner sharing.
   The script augments common forms and cards while preserving the existing app. */
(function(){
  const labels = [
    ["rooms","عدد الغرف","number"],
    ["bathrooms","عدد الحمامات","number"],
    ["living_rooms","عدد الصالات","number"],
    ["salons","عدد الصالونات","number"],
    ["balconies","عدد البلكونات","number"]
  ];

  function addFieldsToForms(){
    document.querySelectorAll("form").forEach(form=>{
      if(form.dataset.v4Done) return;
      const text = (form.innerText||"").toLowerCase();
      if(!text.includes("شقة") && !form.querySelector('[name="apartment_id"]')) return;
      const anchor = form.querySelector("button[type=submit], button");
      if(!anchor) return;
      const wrap=document.createElement("div");
      wrap.className="grid";
      wrap.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0";
      labels.forEach(([name,label,type])=>{
        const box=document.createElement("label");
        box.className="v4-field";
        box.innerHTML=`<span>${label}</span><input name="${name}" type="${type}" min="0" value="0">`;
        wrap.appendChild(box);
      });
      anchor.parentElement.insertBefore(wrap, anchor);
      form.dataset.v4Done="1";
    });
  }

  function shareTextFromCard(card){
    const title=card.querySelector("h1,h2,h3,h4,.title")?.innerText || "تفاصيل الشقة";
    const text=card.innerText.replace(/\n{3,}/g,"\n").trim();
    return `🏠 ${title}\n━━━━━━━━━━━━\n${text}`;
  }

  function addShareButtons(){return;
    document.querySelectorAll("article,.card,.apartment-card,[data-apartment-id]").forEach(card=>{
      if(card.dataset.v4ShareDone || card.querySelector(".v4-share")) return;
      const hasApartment = /شقة|غرفة|إيجار|حمام/.test(card.innerText||"");
      if(!hasApartment) return;
      const id=card.dataset.apartmentId || card.getAttribute("data-id");

      btn.onclick=async()=>{
        try{
          const text=shareTextFromCard(card);
          const media=[...card.querySelectorAll("img,video")].map(x=>x.currentSrc||x.src).filter(Boolean);
          if(navigator.share){
            const data={title:"تفاصيل الشقة",text};
            // Browsers generally require actual File objects for media sharing;
            // use text/link fallback if media cannot be attached.
            await navigator.share(data);
          }else{
            await navigator.clipboard.writeText(text);
            alert("تم نسخ تفاصيل الشقة. يمكنك لصقها ومشاركتها خارج التطبيق.");
          }
        }catch(e){}
      };
      const target=card.querySelector(".actions,.card-actions,footer") || card;
      target.appendChild(btn);
      card.dataset.v4ShareDone="1";
    });
  }

  function addSearchFields(){
    const forms=[...document.querySelectorAll("form")];
    forms.forEach(form=>{
      if(form.dataset.v4SearchDone) return;
      const txt=(form.innerText||"").toLowerCase();

  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",run);
  setTimeout(run,500);

        box.onclick=()=>openFinalAlerts(d.alerts||[]);
      }
      box.innerHTML=`<span>🔴 ${d.count} ${d.count===1?'شقة ستصبح متاحة قريبًا':'شقق ستصبح متاحة قريبًا'}</span><small>اضغط لعرض القائمة</small>`;
    }catch(e){}
  }

  function openFinalAlerts(alerts){
    const modal=document.createElement('div');
    modal.className='final-alert-modal';
    const panel=document.createElement('div');
    panel.className='final-alert-panel';
    panel.innerHTML=`<button class="final-alert-close">إغلاق</button><h2>🚨 الشقق التي ستصبح متاحة قريبًا</h2>`;
    alerts.forEach(a=>{
      const row=document.createElement('div');
      row.className='final-alert-row';
      row.innerHTML=`<strong>🏠 ${a.name||'شقة'}</strong><br>
        🔖 الكود: ${a.code||'—'}<br>
        📅 موعد التوفر: ${a.available_date||'—'}<br>
        ⏳ ${a.days_until_available===0?'متاحة اليوم':`متاحة خلال ${a.days_until_available} يوم`}`;
      panel.appendChild(row);
    });
    modal.appendChild(panel);
    document.body.appendChild(modal);
    panel.querySelector('.final-alert-close').onclick=()=>modal.remove();
    modal.onclick=e=>{if(e.target===modal) modal.remove()};
  }

  document.addEventListener('DOMContentLoaded',()=>{
    loadFinalCounter();
    setInterval(loadFinalCounter,60000);
  });
})();
</script>


<script id="v5-8-final-js">
function v58Price(v){return Number(v||0).toLocaleString("ar-JO");}
function v58CanSeePrice(){return me?.role==="owner";}
function v58Confirm(title,msg="هل تريد المتابعة؟"){
  return new Promise(resolve=>{
    const box=document.createElement("div");box.className="v58-confirm";
    box.innerHTML=`<div class="v58-confirm-box"><h3>${esc(title)}</h3><div class="muted">${esc(msg)}</div><div class="v58-confirm-actions"><button class="btn ghost" id="v58No">إلغاء</button><button class="btn danger" id="v58Yes">تأكيد</button></div></div>`;
    document.body.appendChild(box);box.querySelector("#v58No").onclick=()=>{box.remove();resolve(false)};box.querySelector("#v58Yes").onclick=()=>{box.remove();resolve(true)};
  });
}
function card(a){
  const photos=D.documents.filter(d=>d.apartment_id===a.id&&d.kind==='صورة شقة');
  const videos=D.documents.filter(d=>d.apartment_id===a.id&&d.kind==='فيديو شقة');
  const thumb=photos[0]?.filename?`<img src="/uploads/${encodeURIComponent(photos[0].filename)}" style="width:100%;height:165px;object-fit:cover;border-radius:14px;margin-bottom:12px" alt="صورة الشقة">`:'';
  const price=v58CanSeePrice()?`<br>💰 ${v58Price(a.rent||a.monthly_rent)} د.أ / ${esc(a.rental_type||"شهري")}`:'';
  return `<div class="card" data-apartment-id="${a.id}">${thumb}<h4>شقة ${esc(a.number)}</h4><div class="meta"><b>${esc(a.area)}</b><br>${a.rooms||0} غرف • ${a.baths||0} حمام • ${a.size_m2||0} م²<br>طابق ${a.floor||0}${price}<br>📷 ${photos.length} صورة ${videos.length?` • 🎥 ${videos.length} فيديو`:''}</div><div class="row">${badge(a.status)}<button class="btn ghost" onclick="editA(${a.id})">التفاصيل</button></div></div>`;
}
function apartments(){return `<div class="panel"><div class="head"><h3>إدارة العقارات</h3>${me.role!=="user"?'<button class="btn primary" onclick="addA()">＋ إضافة شقة</button>':''}</div><div class="toolbar v59-search"><input id="aq" placeholder="بحث برقم الشقة أو المنطقة..." oninput="drawA()"><input id="apmin" type="number" min="0" placeholder="أقل سعر" oninput="drawA()"><input id="apmax" type="number" min="0" placeholder="أعلى سعر" oninput="drawA()"><select id="arooms" onchange="drawA()"><option value="">كل الغرف</option><option value="1">1 غرفة</option><option value="2">2 غرف</option><option value="3">3 غرف</option><option value="4">4 غرف</option></select><select id="art" onchange="drawA()"><option value="">كل أنواع الإيجار</option><option>يومي</option><option>شهري</option><option>سنوي</option></select><select id="af" onchange="drawA()"><option value="">كل المناطق</option>${D.areas.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select><select id="as" onchange="drawA()"><option value="">كل الحالات</option>${statuses.map(s=>`<option>${s}</option>`).join("")}</select><button id="priceSortBtn" class="btn primary v59-sort" onclick="togglePriceSort()">↕ السعر: الأقل أولاً</button><button class="btn ghost" onclick="resetApartmentSearch()">مسح البحث</button><button class="btn ghost" onclick="location.href='/api/export/apartments.csv'">تصدير CSV</button></div><div id="alist" class="cards" style="margin-top:16px"></div></div>`}
function v59SearchPrice(a,rt){if(rt==='يومي')return Number(a.daily_rent||0);if(rt==='سنوي')return Number(a.annual_rent||0);return Number(a.monthly_rent||a.rent||0)}
function drawA(){let q=($('aq')?.value||'').toLowerCase(),ar=$('af')?.value||'',st=$('as')?.value||'',rt=$('art')?.value||'',min=Number($('apmin')?.value||0),max=Number($('apmax')?.value||0),rooms=Number($('arooms')?.value||0);let x=D.apartments.filter(a=>{let p=v59SearchPrice(a,rt);return (a.number+' '+a.area).toLowerCase().includes(q)&&(!ar||a.area===ar)&&(!st||a.status===st)&&(!rt||a.rental_type===rt)&&(!rooms||Number(a.rooms||0)===rooms)&&(!min||p>=min)&&(!max||p<=max)});if(window.v59PriceSort!=='none')x.sort((a,b)=>{let pa=v59SearchPrice(a,rt),pb=v59SearchPrice(b,rt);return window.v59PriceSort==='desc'?pb-pa:pa-pb});$('alist').innerHTML=x.length?x.map(card).join(''):'<div class="empty">لا توجد نتائج</div>'}
function togglePriceSort(){window.v59PriceSort=window.v59PriceSort==='asc'?'desc':'asc';let b=$('priceSortBtn');if(b)b.textContent=window.v59PriceSort==='asc'?'↕ السعر: الأقل أولاً':'↕ السعر: الأعلى أولاً';drawA()}
function resetApartmentSearch(){['aq','apmin','apmax'].forEach(id=>{if($(id))$(id).value=''});['arooms','art','af','as'].forEach(id=>{if($(id))$(id).value=''});window.v59PriceSort='none';let b=$('priceSortBtn');if(b)b.textContent='↕ السعر: الأقل أولاً';drawA()}
window.v59PriceSort='none';
function aForm(a={}){let rt=a.rental_type||'شهري';return `<div class="formgrid"><div class="field"><label>كود الشقة</label><input id="acode" value="${esc(a.code||a.number||'')}"></div><div class="field"><label>رقم الشقة</label><input id="an" value="${esc(a.number||'')}"></div><div class="field"><label>المنطقة</label><select id="aa">${D.areas.map(x=>`<option value="${x.id}" ${(x.id===a.area_id||x.name===a.area)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الحالة</label><select id="ast">${statuses.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>نوع الإيجار</label><select id="artype"><option ${rt==='يومي'?'selected':''}>يومي</option><option ${rt==='شهري'?'selected':''}>شهري</option><option ${rt==='سنوي'?'selected':''}>سنوي</option></select></div><div class="field"><label>المساحة (م²)</label><input id="az" type="number" value="${a.size_m2||0}"></div><div class="field"><label>الغرف</label><input id="ro" type="number" value="${a.rooms||0}"></div><div class="field"><label>الحمامات</label><input id="ba" type="number" value="${a.baths||0}"></div><div class="field"><label>الصالات</label><input id="lr" type="number" value="${a.living_rooms||0}"></div><div class="field"><label>الصالونات</label><input id="sal" type="number" value="${a.salons||0}"></div><div class="field"><label>البلكونات</label><input id="bal" type="number" value="${a.balconies||0}"></div><div class="field"><label>الطابق</label><input id="fl" type="number" value="${a.floor||1}"></div>${v58CanSeePrice()?`<div class="full v58-rent-grid"><div class="v58-price"><label>الإيجار اليومي</label><input id="rd" type="number" value="${a.daily_rent||0}"></div><div class="v58-price"><label>الإيجار الشهري</label><input id="rm" type="number" value="${a.monthly_rent||a.rent||0}"></div><div class="v58-price"><label>الإيجار السنوي</label><input id="ry" type="number" value="${a.annual_rent||0}"></div></div>`:`<input id="rd" type="hidden" value="${a.daily_rent||0}"><input id="rm" type="hidden" value="${a.monthly_rent||a.rent||0}"><input id="ry" type="hidden" value="${a.annual_rent||0}">`}<div class="field"><label>موعد التوفر</label><input id="avdate" type="date" value="${esc(a.available_date||'')}"></div><div class="field"><label>التنبيه قبل التوفر بعدد الأيام</label><input id="avdays" type="number" min="0" max="365" value="${a.availability_alert_days||0}"></div><div class="field"><label><input id="aven" type="checkbox" ${a.availability_alert_enabled?'checked':''}> تفعيل تنبيه قرب التوفر</label></div><div class="field full"><label>ملاحظات</label><textarea id="no">${esc(a.notes||'')}</textarea></div></div>`}
function addA(){modal(`<div class="modalhead"><h3>إضافة شقة جديدة</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div>${aForm()}<button class="btn primary" style="margin-top:14px" onclick="saveA()">حفظ الشقة</button>`)}
function editA(id){let a=D.apartments.find(x=>x.id===id);let photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة');let videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='فيديو شقة');modal(`<div class="modalhead"><h3>تفاصيل الشقة ${esc(a.number)}</h3><button class="btn ghost" onclick="closeM()">إغلاق</button></div>${aForm(a)}${me.role==='owner'?`<div class="v55-share-row"><button class="v55-share-btn v58-share-image" onclick="shareApartmentDetails(${id})">📝 مشاركة التفاصيل كصورة</button></div>`:''}<div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>📷 صور الشقة</h3><span class="muted">${photos.length} صورة</span></div>${me.role==='owner'&&photos.length?`<button class="v55-share-btn v55-share-photos" onclick="shareApartmentPhotos(${id})">🖼 مشاركة الصور كصور</button>`:''}${me.role!=='user'?`<input id="apPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadApartmentPhotos(${id})">`:''}<div id="photos_${id}" class="photos">${photos.length?photos.map((p,i)=>photoHtml(p,i)).join(''):'<div class="photoempty full">لا توجد صور لهذه الشقة</div>'}</div></div><div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>🎥 فيديو الشقة</h3><span class="muted">${videos.length} فيديو</span></div>${me.role!=='user'?`<input id="apVideo" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v" onchange="uploadApartmentVideo(${id})">`:''}${videos.length?videos.map(videoHtml).join(''):'<div class="photoempty">لا يوجد فيديو لهذه الشقة</div>'}</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" onclick="saveA(${id})">حفظ التعديل</button>${me.role==='owner'?`<button class="btn danger" onclick="delA(${id})">حذف الشقة</button>`:''}</div>`)}
async function saveA(id){if(id&&!(await v58Confirm('تأكيد تعديل الشقة','سيتم حفظ جميع التعديلات على بيانات الشقة.')))return;try{let monthly=+($('rm')?.value||0);let b={number:an.value,code:acode.value||an.value,area_id:+aa.value,status:ast.value,rent:monthly,size_m2:+az.value,rooms:+ro.value,baths:+ba.value,kitchen:1,floor:+fl.value,notes:no.value,rental_type:artype.value,daily_rent:+rd.value,monthly_rent:monthly,annual_rent:+ry.value,available_date:avdate.value||null,living_rooms:+lr.value,salons:+sal.value,balconies:+bal.value,availability_alert_days:+avdays.value||0,availability_alert_enabled:aven.checked};await api(id?'/api/apartments/'+id:'/api/apartments',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeM();await load();notify('تم حفظ البيانات بنجاح');}catch(e){alert(e.message)}}
async function delA(id){if(!(await v58Confirm('تأكيد حذف الشقة','لا يمكن التراجع عن حذف الشقة وبياناتها.')))return;try{await api('/api/apartments/'+id,{method:'DELETE'});closeM();await load();notify('تم حذف الشقة');}catch(e){alert(e.message)}}
async function deletePhoto(id){if(!(await v58Confirm('تأكيد حذف الصورة','سيتم حذف الصورة نهائياً.')))return;try{let d=D.documents.find(x=>x.id===id);await api('/api/documents/'+id,{method:'DELETE'});await load();if(d)editA(d.apartment_id);notify('تم حذف الصورة');}catch(e){alert(e.message)}}
async function deleteVideo(id,apartmentId){if(!(await v58Confirm('تأكيد حذف الفيديو','سيتم حذف الفيديو نهائياً.')))return;try{await api('/api/documents/'+id,{method:'DELETE'});await load();editA(apartmentId);notify('تم حذف الفيديو');}catch(e){alert(e.message)}}
async function shareApartmentDetails(id){try{if(me?.role!=='owner')return alert('المشاركة متاحة للمالك فقط');let a=D.apartments.find(x=>x.id===id);if(!a)throw Error('الشقة غير موجودة');let canvas=document.createElement('canvas'),w=1200,p=65;let rows=[['شقة',a.number],['المنطقة',a.area||'—'],['الغرف',a.rooms||0],['الحمامات',a.baths||0],['المساحة',`${a.size_m2||0} م²`],['الطابق',a.floor||0],['نوع الإيجار',a.rental_type||'شهري'],['اليومي',`${v58Price(a.daily_rent)} د.أ`],['الشهري',`${v58Price(a.monthly_rent||a.rent)} د.أ`],['السنوي',`${v58Price(a.annual_rent)} د.أ`],['الحالة',a.status||'—']];let h=180+rows.length*78;canvas.width=w;canvas.height=h;let c=canvas.getContext('2d');c.fillStyle='#f8f2e7';c.fillRect(0,0,w,h);c.fillStyle='#20142b';c.roundRect(35,35,w-70,110,28);c.fill();c.fillStyle='#f1d486';c.font='900 46px Tahoma';c.textAlign='right';c.fillText(`شقة ${a.number}`,w-75,105);c.fillStyle='#fffdf8';c.font='700 24px Tahoma';c.fillText(a.area||'',w-75,140);let y=205;for(const [k,v] of rows.slice(2)){c.fillStyle='#fffdf9';c.roundRect(45,y-45,w-90,62,16);c.fill();c.fillStyle='#6d6670';c.font='600 24px Tahoma';c.textAlign='right';c.fillText(k,w-75,y-7);c.fillStyle='#201b24';c.font='800 25px Tahoma';c.fillText(String(v),75,y-7);y+=78}let blob=await new Promise(r=>canvas.toBlob(r,'image/png'));let file=new File([blob],`شقة-${a.number}-تفاصيل.png`,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`تفاصيل شقة ${a.number}`,files:[file]});}else{throw Error('هذا المتصفح لا يدعم مشاركة الصورة مباشرة. افتح التطبيق من Chrome على الهاتف.')}}catch(e){if(e?.name==='AbortError')return;alert(e.message||'تعذر مشاركة الصورة')}}
function notify(msg){let n=document.createElement('div');n.style='position:fixed;bottom:20px;right:20px;z-index:5000;background:#20142b;color:#fff;padding:13px 17px;border-radius:13px;box-shadow:0 8px 25px #0004;font-weight:800';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
async function clearLogs(){if(me.role!=='owner')return;if(!(await v58Confirm('تأكيد مسح السجل','سيتم حذف سجل العمليات بالكامل.')))return;try{await api('/api/logs',{method:'DELETE'});await load();notify('تم مسح السجل');}catch(e){alert(e.message)}}
function logs(){return `<div class="panel"><div class="head"><h3>سجل العمليات</h3>${me.role==='owner'?'<button class="btn danger" onclick="clearLogs()">🗑 مسح السجل</button>':''}</div><div class="timeline">${D.logs.map(l=>`<div class="event"><b>${esc(l.action)}</b> — ${esc(l.detail)}<br><small>${esc(l.created_at)} • ${esc(l.who)}</small></div>`).join('')||'<div class="empty">لا توجد عمليات</div>'}</div></div>`}
</script>
