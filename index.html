<script id="v5-11-final-overrides">
function v511Price(a,rt){if(rt==='يومي')return Number(a.daily_rent||0);if(rt==='سنوي')return Number(a.annual_rent||0);return Number(a.monthly_rent||a.rent||0)}
function v511OpenPriceRange(){
  const box=document.createElement('div'); box.className='wa-picker';
  box.innerHTML=`<div class="wa-picker-box"><div class="modalhead"><h3>🔎 بحث الشقق حسب السعر</h3><button class="btn ghost" id="v511RangeClose">إغلاق</button></div><div class="notice">حدد السعر من وإلى، وسيتم تطبيق البحث على نوع الإيجار المختار.</div><div class="formgrid"><div class="field"><label>من سعر</label><input id="v511Min" type="number" min="0" value="${window.v511Min??''}"></div><div class="field"><label>إلى سعر</label><input id="v511Max" type="number" min="0" value="${window.v511Max??''}"></div></div><div class="wa-range-actions"><button class="btn ghost" id="v511RangeClear">مسح السعر</button><button class="btn primary" id="v511RangeApply">تطبيق البحث</button></div></div>`;
  document.body.appendChild(box);
  box.querySelector('#v511RangeClose').onclick=()=>box.remove();
  box.querySelector('#v511RangeClear').onclick=()=>{window.v511Min='';window.v511Max='';box.remove();drawA()};
  box.querySelector('#v511RangeApply').onclick=()=>{let mn=Number(box.querySelector('#v511Min').value||0),mx=Number(box.querySelector('#v511Max').value||0);if(mn&&mx&&mn>mx){alert('السعر الأدنى لا يمكن أن يكون أكبر من السعر الأعلى');return}window.v511Min=mn||'';window.v511Max=mx||'';box.remove();drawA()};
  box.onclick=e=>{if(e.target===box)box.remove()};
}
function apartments(){return `<div class="panel"><div class="head"><h3>إدارة العقارات</h3>${me.role!=="user"?'<button class="btn primary" onclick="addA()">＋ إضافة شقة</button>':''}</div><div class="toolbar v59-search"><input id="aq" placeholder="بحث برقم الشقة أو المنطقة..." oninput="drawA()"><select id="arooms" onchange="drawA()"><option value="">كل الغرف</option><option value="1">1 غرفة</option><option value="2">2 غرف</option><option value="3">3 غرف</option><option value="4">4 غرف</option></select><select id="art" onchange="drawA()"><option value="">كل أنواع الإيجار</option><option>يومي</option><option>شهري</option><option>سنوي</option></select><select id="af" onchange="drawA()"><option value="">كل المناطق</option>${D.areas.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select><select id="as" onchange="drawA()"><option value="">كل الحالات</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn primary" onclick="v511OpenPriceRange()">💰 بحث من سعر إلى سعر</button><button class="btn ghost" onclick="resetApartmentSearch()">مسح البحث</button><button class="btn ghost" onclick="location.href='/api/export/apartments.csv'">تصدير CSV</button></div><div class="notice" style="margin-top:10px">بحث السعر يتم حسب النوع المختار: يومي أو شهري أو سنوي.</div><div id="alist" class="cards" style="margin-top:16px"></div></div>`}
function drawA(){let q=($('aq')?.value||'').toLowerCase(),ar=$('af')?.value||'',st=$('as')?.value||'',rt=$('art')?.value||'',rooms=Number($('arooms')?.value||0),min=Number(window.v511Min||0),max=Number(window.v511Max||0);let x=D.apartments.filter(a=>{let p=v511Price(a,rt);return (a.number+' '+a.area).toLowerCase().includes(q)&&(!ar||a.area===ar)&&(!st||a.status===st)&&(!rt||a.rental_type===rt)&&(!rooms||Number(a.rooms||0)===rooms)&&(!min||p>=min)&&(!max||p<=max)});$('alist').innerHTML=x.length?x.map(card).join(''):'<div class="empty">لا توجد نتائج</div>'}
function resetApartmentSearch(){['aq','arooms','art','af','as'].forEach(id=>{if($(id))$(id).value=''});window.v511Min='';window.v511Max='';drawA()}
function v511WaShare(files,title){return navigator.share&&navigator.canShare&&navigator.canShare({files})?navigator.share({title,files}):Promise.reject(new Error('افتح التطبيق من Chrome على الهاتف لاستخدام مشاركة WhatsApp للصور أو الفيديو.'))}
function waDetailsButton(id){return `<button class="btn wa-btn" onclick="shareApartmentDetails(${id})">🟢 واتساب</button>`}
async function shareApartmentPhotos(id){
  if(me?.role!=='owner'){alert('المشاركة متاحة للمالك فقط');return}
  const photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة'); if(!photos.length){alert('لا توجد صور لهذه الشقة');return}
  const box=document.createElement('div');box.className='wa-picker';
  box.innerHTML=`<div class="wa-picker-box"><div class="modalhead"><h3>🟢 إرسال الصور عبر WhatsApp</h3><button class="btn ghost" id="waClose">إغلاق</button></div><div class="notice">حدد عدد الصور التي تريد إرسالها، ثم اضغط WhatsApp. سيظهر WhatsApp ضمن قائمة المشاركة في الهاتف.</div><div class="wa-photo-list">${photos.map((p,i)=>`<label class="wa-photo-item"><input type="checkbox" data-i="${i}"><img src="/uploads/${encodeURIComponent(p.filename)}" alt="صورة ${i+1}"></label>`).join('')}</div><div class="wa-range-actions"><button class="btn ghost" id="waAll">تحديد الكل</button><button class="btn wa-btn" id="waSend">🟢 WhatsApp — إرسال الصور</button></div></div>`;
  document.body.appendChild(box);box.querySelector('#waClose').onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove()};
  box.querySelectorAll('.wa-photo-item').forEach(el=>{el.onclick=e=>{if(e.target.tagName!=='INPUT'){const cb=el.querySelector('input');cb.checked=!cb.checked}el.classList.toggle('selected',el.querySelector('input').checked)}});
  box.querySelector('#waAll').onclick=()=>box.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=true;cb.closest('.wa-photo-item').classList.add('selected')});
  box.querySelector('#waSend').onclick=async()=>{try{const chosen=[...box.querySelectorAll('input[type=checkbox]:checked')].map(cb=>photos[Number(cb.dataset.i)]);if(!chosen.length){alert('حدد صورة واحدة على الأقل');return}const files=[];for(const d of chosen){const r=await fetch('/uploads/'+encodeURIComponent(d.filename));if(r.ok){const b=await r.blob();files.push(new File([b],d.original_name||d.filename,{type:b.type||'image/jpeg'}))}}if(!files.length)throw Error('تعذر تجهيز الصور');await v511WaShare(files,'صور الشقة');box.remove()}catch(e){if(e?.name!=='AbortError')alert(e.message||'تعذر مشاركة الصور')}};
}
async function shareApartmentVideo(id){
  if(me?.role!=='owner'){alert('المشاركة متاحة للمالك فقط');return}
  const a=D.apartments.find(x=>x.id===id),d=D.documents.find(x=>x.apartment_id===id&&x.kind==='فيديو شقة');if(!a||!d){alert('لا يوجد فيديو لهذه الشقة');return}
  try{const r=await fetch('/uploads/'+encodeURIComponent(d.filename));if(!r.ok)throw Error('تعذر تجهيز الفيديو');const b=await r.blob();const file=new File([b],d.original_name||`فيديو-شقة-${a.number}.mp4`,{type:b.type||'video/mp4'});await v511WaShare([file],`فيديو شقة ${a.number}`)}catch(e){if(e?.name!=='AbortError')alert(e.message||'تعذر مشاركة الفيديو')}
}
function videoHtml(d){return `<div class="video-wrap v55-video-card" onclick="openMiniVideo(${d.apartment_id})"><div class="v55-video-play-label">▶ تشغيل داخل التطبيق</div><video class="v55-video-thumb" muted playsinline preload="metadata" src="/uploads/${encodeURIComponent(d.filename)}"></video><div class="row" onclick="event.stopPropagation()"><span class="muted">🎥 ${esc(d.original_name)}</span><div class="v510-video-actions"><button class="btn ghost" onclick="openMiniVideo(${d.apartment_id})">▶ تشغيل</button>${me.role==='owner'?`<button class="btn wa-btn" onclick="shareApartmentVideo(${d.apartment_id})">🟢 WhatsApp — إرسال الفيديو</button><button class="btn v510-video-download" onclick="downloadApartmentVideo(${d.id})">⬇ تحميل</button>`:''}${me.role!=='user'?`<button class="btn danger" onclick="deleteVideo(${d.id},${d.apartment_id})">حذف</button>`:''}</div></div></div>`}
async function shareApartmentDetails(id){
  if(me?.role!=='owner'){alert('المشاركة متاحة للمالك فقط');return}
  const a=D.apartments.find(x=>x.id===id);if(!a)throw Error('الشقة غير موجودة');
  const rows=[['الكود',a.code||a.number||'—'],['رقم الشقة',a.number||'—'],['المنطقة',a.area||'—'],['الحالة',a.status||'—'],['الغرف',a.rooms||0],['الحمامات',a.baths||0],['الصالات',a.living_rooms||0],['الصالونات',a.salons||0],['البلكونات',a.balconies||0],['المساحة',`${a.size_m2||0} م²`],['الطابق',a.floor||0],['نوع الإيجار',a.rental_type||'—'],['الإيجار اليومي',`${v58Price(a.daily_rent)} د.أ`],['الإيجار الشهري',`${v58Price(a.monthly_rent||a.rent)} د.أ`],['الإيجار السنوي',`${v58Price(a.annual_rent)} د.أ`],['موعد التوفر',a.available_date||'غير محدد'],['التنبيه قبل التوفر',`${a.availability_alert_days||0} يوم`],['الملاحظات',a.notes||'—']];
  const w=1200,rowH=68,h=170+rows.length*rowH;const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.fillStyle='#f7f0e4';c.fillRect(0,0,w,h);c.fillStyle='#251432';c.roundRect(35,30,w-70,105,24);c.fill();c.fillStyle='#f1d486';c.font='900 44px Tahoma';c.textAlign='right';c.direction='rtl';c.fillText(`تفاصيل الشقة — ${a.number||''}`,w-70,88);c.font='700 23px Tahoma';c.fillText(a.area||'',w-70,120);let y=180;rows.forEach(([k,v],i)=>{c.fillStyle=i%2?'#fffaf2':'#f1e8d9';c.roundRect(45,y-34,w-90,54,13);c.fill();c.fillStyle='#756b75';c.font='700 21px Tahoma';c.textAlign='right';c.fillText(k,w-80,y);c.fillStyle='#241c27';c.font='800 22px Tahoma';c.textAlign='left';c.fillText(String(v),80,y);y+=rowH});c.fillStyle='#6d6370';c.font='600 18px Tahoma';c.textAlign='right';c.fillText('إدارة عقارات غرب عمّان',w-70,h-18);const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));if(!blob)throw Error('تعذر إنشاء صورة التفاصيل');const file=new File([blob],`تفاصيل-الشقة-${a.number||id}.png`,{type:'image/png'});await v511WaShare([file],`تفاصيل شقة ${a.number||''}`)
}
function editA(id){let a=D.apartments.find(x=>x.id===id);let photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة');let videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='فيديو شقة');modal(`<div class="modalhead"><h3>تفاصيل الشقة ${esc(a.number)}</h3><button class="btn ghost" onclick="closeM()">✕ إغلاق</button></div>${aForm(a)}${me.role==='owner'?`<div class="v55-share-row"><button class="btn wa-btn" onclick="shareApartmentDetails(${id})">🟢 WhatsApp — التفاصيل كجدول</button></div>`:''}<div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>📷 صور الشقة</h3><span class="muted">${photos.length} صورة</span></div>${me.role==='owner'&&photos.length?`<button class="btn wa-btn" onclick="shareApartmentPhotos(${id})">🟢 WhatsApp — تحديد الصور</button>`:''}${me.role!=='user'?`<input id="apPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadApartmentPhotos(${id})">`:''}<div id="photos_${id}" class="photos">${photos.length?photos.map((p,i)=>photoHtml(p,i)).join(''):'<div class="photoempty full">لا توجد صور لهذه الشقة</div>'}</div></div><div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>🎥 فيديو الشقة</h3><span class="muted">${videos.length} فيديو</span></div>${me.role!=='user'?`<label class="btn ghost" style="display:inline-flex;align-items:center;gap:6px">🎥 تحميل فيديو الشقة<input id="apVideo" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v" onchange="uploadApartmentVideo(${id})" style="display:none"></label>`:''}${videos.length?videos.map(videoHtml).join(''):'<div class="photoempty">لا يوجد فيديو لهذه الشقة</div>'}</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" onclick="saveA(${id})">حفظ التعديل</button>${me.role==='owner'?`<button class="btn danger" onclick="delA(${id})">حذف الشقة</button>`:''}</div>`)}
function tenants(){return `<div class="panel"><div class="head"><h3>المستأجرون والعقود</h3>${me.role!=="user"?'<button class="btn primary" onclick="addT()">＋ إضافة مستأجر</button>':''}</div><table><thead><tr><th>المستأجر</th><th>الشقة</th><th>الهاتف</th><th>الإيجار</th><th>بداية العقد</th><th>نهاية العقد</th><th>التجديد</th><th>الوثيقة</th></tr></thead><tbody>${D.tenants.map(t=>{let docs=D.documents.filter(d=>d.tenant_id===t.id&&d.kind==='هوية/جواز');return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.apartment||'—')}</td><td>${esc(t.phone)}</td><td>${Number(t.monthly_rent||0).toLocaleString()}</td><td>${esc(t.contract_start||'—')}</td><td>${esc(t.contract_end||'—')}</td><td><span class="renew-toggle"><span class="renew-dot ${t.renewal_enabled?'on':'off'}"></span>${t.renewal_enabled?'مفعّل':'متوقف'}</span></td><td>${docs.length?`<span class="tenant-doc">📎 ${docs.length} ملف</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">لا يوجد مستأجرون</td></tr>'}</tbody></table></div>`}
function addT(){modal(`<div class="modalhead"><h3>إضافة مستأجر وعقد</h3><button class="btn ghost" onclick="closeM()">✕ إغلاق</button></div><div class="formgrid"><div class="field"><label>الاسم</label><input id="tn"></div><div class="field"><label>الهاتف</label><input id="tp"></div><div class="field"><label>رقم الهوية</label><input id="tid"></div><div class="field"><label>الشقة</label><select id="ta"><option value="">بدون</option>${D.apartments.map(a=>`<option value="${a.id}">${a.number} — ${a.area}</option>`).join('')}</select></div><div class="field"><label>بداية العقد</label><input id="cs" type="date"></div><div class="field"><label>نهاية العقد</label><input id="ce" type="date"></div><div class="field"><label>الإيجار الشهري</label><input id="tr" type="number"></div><div class="field"><label>التأمين</label><input id="dep" type="number"></div><div class="field full"><label>صورة الهوية أو جواز السفر</label><input id="tDoc" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><div class="field full"><button type="button" class="renew-toggle" id="renewToggle"><span class="renew-dot on"></span><span>التجديد: مفعّل</span></button></div><div class="field full"><label>ملاحظات</label><textarea id="tnote"></textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveT()">حفظ المستأجر</button>`);let b=$('renewToggle');b.dataset.enabled='1';b.onclick=()=>{let on=b.dataset.enabled==='1';b.dataset.enabled=on?'0':'1';b.innerHTML=`<span class="renew-dot ${on?'off':'on'}"></span><span>التجديد: ${on?'متوقف':'مفعّل'}</span>`}}
async function saveT(){try{const enabled=$('renewToggle')?.dataset.enabled!=='0';const j=await api('/api/tenants',{method:'POST',body:JSON.stringify({name:tn.value,phone:tp.value,national_id:tid.value,apartment_id:ta.value?+ta.value:null,contract_start:cs.value,contract_end:ce.value,monthly_rent:+tr.value,deposit:+dep.value,status:'نشط',renewal_enabled:enabled,notes:tnote.value})});const f=$('tDoc')?.files?.[0];if(f&&j.id){let fd=new FormData();fd.append('file',f);fd.append('tenant_id',j.id);fd.append('kind','هوية/جواز');let r=await fetch('/api/documents',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});let x=await r.json();if(!r.ok)throw Error(x.error||'تعذر رفع وثيقة الهوية')}closeM();await load();notify('تم حفظ المستأجر والوثيقة بنجاح')}catch(e){alert(e.message)}}

<script>
let token=localStorage.getItem("wa_token"),me=JSON.parse(localStorage.getItem("wa_me")||"null"),D=null,page="home",search="";
const statuses=["متاحة","قريبة من التوفر","الحجز ينتهي قريباً","مؤجرة / محجوزة","غير متاحة / صيانة"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};if(opt.body&&!opt.headers["Content-Type"])opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}
function login(){ $("root").innerHTML=`<div class="login"><div class="loginbox"><div class="logo">⌂</div><h1>إدارة عقارات غرب عمّان</h1><p class="muted" style="text-align:center">النظام النهائي — هاتف وكمبيوتر</p><div class="demo"><b>تجربة:</b><br>owner / 1234 — مالك<br>admin / 1234 — مدير<br>user / 1234 — عرض فقط</div><div class="field"><label>اسم المستخدم</label><input id="lu" value="owner"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" value="1234"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="doLogin()">تسجيل الدخول</button></div></div>`}
async function doLogin(){try{let j=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:lu.value,password:lp.value})}).then(r=>r.json());if(!j.token)throw Error(j.error);token=j.token;me=j.user;localStorage.setItem("wa_token",token);localStorage.setItem("wa_me",JSON.stringify(me));await load()}catch(e){alert(e.message)}}
async function load(){if(!token)return login();try{D=await api("/api/bootstrap");render()}catch(e){localStorage.clear();token=null;me=null;login()}}
function nav(p){page=p;search="";render()}
function role(){return me.role==="owner"?"المالك":me.role==="admin"?"مسؤول النظام":"مستخدم عادي"}
function shell(){let titles={home:"الرئيسية",apartments:"الشقق والعقارات",tenants:"المستأجرون والعقود",finance:"الدفعات والمالية",users:"المستخدمون والصلاحيات",logs:"سجل العمليات",security:"النسخ الاحتياطي والحماية",chat:"محادثة المالك وAdmin"};$("root").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo v513-logo3d v539-logo"><img src="/west-amman-luxury-logo.jpg" alt="عقارات عمان الغربية"></div><div><b>عقارات غرب عمّان</b><br><small>نظام الإدارة</small></div></div><div class="nav">
<button class="${page==="home"?"active":""}" onclick="nav('home')">⌂ الرئيسية</button><button class="${page==="apartments"?"active":""}" onclick="nav('apartments')">▦ الشقق</button><button class="${page==="tenants"?"active":""}" onclick="nav('tenants')">♙ المستأجرون</button><button class="${page==="finance"?"active":""}" onclick="nav('finance')">د.أ المالية</button><button class="${page==="users"?"active":""}" onclick="nav('users')">◉ الصلاحيات</button><button class="${page==="logs"?"active":""}" onclick="nav('logs')">◷ السجل</button>${["owner","admin"].includes(me.role)?`<button class="${page==="chat"?"active":""}" onclick="nav('chat')">💬 المحادثة</button>`:""}<button onclick="logout()">↪ خروج</button></div></aside><main class="main"><div class="top"><h2>${titles[page]}</h2><div class="user">${role()} <div class="avatar">${me.role==="owner"?"♛":"●"}</div></div></div><div class="content">${view()}</div><footer>نظام إدارة عقارات غرب عمّان • PWA • SQLite</footer></main></div>`}
function view(){return page==="home"?home():page==="apartments"?apartments():page==="tenants"?tenants():page==="finance"?finance():page==="users"?users():page==="chat"?chat():page==="security"?securityBackupPage():logs()}

async function shareMediaFiles(id, kind){
  try{
    if(me?.role!=="owner"){alert("المشاركة متاحة للمالك فقط");return;}
    const docs=D.documents.filter(d=>d.apartment_id===id && d.kind===kind);
    if(!docs.length){alert(kind==="صورة شقة"?"لا توجد صور لهذه الشقة":"لا يوجد فيديو لهذه الشقة");return;}

    const files=[];
    for(const d of docs){
      const r=await fetch("/uploads/"+encodeURIComponent(d.filename),{credentials:"same-origin"});
      if(!r.ok) continue;
      const blob=await r.blob();
      let type=blob.type;
      if(!type){
        const ext=(d.filename||"").toLowerCase().split(".").pop();
        type=kind==="صورة شقة" ? (ext==="png"?"image/png":ext==="webp"?"image/webp":"image/jpeg")
                               : (ext==="webm"?"video/webm":"video/mp4");
      }
      files.push(new File([blob],d.original_name||d.filename,{type}));
    }
    if(!files.length) throw Error("لم يتم تجهيز الملفات");

    if(navigator.share && navigator.canShare && navigator.canShare({files})){
      await navigator.share({
        title: kind==="صورة شقة" ? "صور الشقة" : "فيديو الشقة",
        files
      });
      return;
    }

    // Fallback: open the first media so the user can use the device's share menu.
    const u=URL.createObjectURL(files[0]);
    const a=document.createElement("a"); a.href=u; a.download=files[0].name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
    alert("متصفحك لا يدعم مشاركة الوسائط مباشرة. تم تجهيز الملف الأول للمشاركة من الجهاز.");
  }catch(e){
    if(e?.name==="AbortError") return;
    console.error(e);
    alert("تعذر مشاركة الوسائط. تأكد من السماح للمتصفح بالمشاركة ثم جرّب مرة أخرى.");
  }
}

function openMiniVideo(id){
  const videos=D.documents.filter(d=>d.apartment_id===id&&d.kind==="فيديو شقة");
  if(!videos.length){alert("لا يوجد فيديو لهذه الشقة");return;}
  const p=videos[0];
  const box=document.createElement("div");
  box.className="v55-video-modal";
  box.innerHTML=`
    <div class="v55-video-panel">
      <button class="v55-video-close" aria-label="إغلاق">×</button>
      <div class="v55-video-title">🎥 فيديو الشقة</div>
      <video class="v55-mini-video" controls autoplay playsinline preload="metadata"
        src="/uploads/${encodeURIComponent(p.filename)}"></video>
    </div>`;
  document.body.appendChild(box);
  const v=box.querySelector("video");
  box.querySelector(".v55-video-close").onclick=()=>{v.pause();box.remove()};
  box.onclick=e=>{if(e.target===box){v.pause();box.remove()}};
}

async function shareFilesForApartment(id, kind){
  try{
    if(me?.role!=="owner"){alert("المشاركة متاحة للمالك فقط");return;}
    const a=D.apartments.find(x=>x.id===id);
    if(!a) throw Error("الشقة غير موجودة");
    let docs=[];
    let title="";
    if(kind==="photos"){
      docs=D.documents.filter(d=>d.apartment_id===id&&d.kind==="صورة شقة");
      title=`صور شقة ${a.number}`;
      if(!docs.length){alert("لا توجد صور لهذه الشقة");return;}
    }else if(kind==="video"){
      docs=D.documents.filter(d=>d.apartment_id===id&&d.kind==="فيديو شقة");
      title=`فيديو شقة ${a.number}`;
      if(!docs.length){alert("لا يوجد فيديو لهذه الشقة");return;}
    }

    if(!navigator.share){
      const links=docs.map(d=>location.origin+"/uploads/"+encodeURIComponent(d.filename));
      await navigator.clipboard.writeText(links.join("\\n"));
      alert("تم نسخ روابط الملفات. متصفحك لا يدعم مشاركة الملفات مباشرة.");
      return;
    }

    const files=[];
    for(const d of docs){
      const r=await fetch("/uploads/"+encodeURIComponent(d.filename),{credentials:"same-origin"});
      if(!r.ok) continue;
      const blob=await r.blob();
      const fallbackType=kind==="video"?"video/mp4":"image/jpeg";
      files.push(new File([blob],d.original_name||d.filename,{type:blob.type||fallbackType}));
    }

    if(files.length && navigator.canShare && navigator.canShare({files})){
      await navigator.share({title,files});
    }else{
      const links=docs.map(d=>location.origin+"/uploads/"+encodeURIComponent(d.filename));
      await navigator.share({title,text:links.join("\\n")});
    }
  }catch(e){
    if(e?.name==="AbortError") return;
    alert("تعذر مشاركة الملف. جرّب مرة أخرى.");
  }
}

function openApartmentGallery(apartmentId,index){
  const photos=D.documents.filter(d=>d.apartment_id===apartmentId&&d.kind==="صورة شقة");
  if(!photos.length)return;
  let i=Math.max(0,Math.min(index||0,photos.length-1));
  const box=document.createElement("div");
  box.className="v55-gallery";
  box.innerHTML=`
    <div class="v55-gallery-box">
      <button class="v55-gallery-close" aria-label="إغلاق">×</button>
      <button class="v55-gallery-prev" aria-label="الصورة السابقة">›</button>
      <img class="v55-gallery-img" alt="صورة الشقة">
      <button class="v55-gallery-next" aria-label="الصورة التالية">‹</button>
      <div class="v55-gallery-count"></div>
    </div>`;
  document.body.appendChild(box);
  const img=box.querySelector(".v55-gallery-img");
  const count=box.querySelector(".v55-gallery-count");
  const render=()=>{
    const p=photos[i];
    img.src="/uploads/"+encodeURIComponent(p.filename);
    img.alt=p.original_name||"صورة الشقة";
    count.textContent=`${i+1} / ${photos.length}`;
  };
  const next=()=>{i=(i+1)%photos.length;render()};
  const prev=()=>{i=(i-1+photos.length)%photos.length;render()};
  box.querySelector(".v55-gallery-close").onclick=()=>box.remove();
  box.querySelector(".v55-gallery-next").onclick=next;
  box.querySelector(".v55-gallery-prev").onclick=prev;
  box.onclick=e=>{if(e.target===box)box.remove()};
  document.addEventListener("keydown",function handler(e){
    if(!document.body.contains(box)){document.removeEventListener("keydown",handler);return}
    if(e.key==="Escape"){box.remove();document.removeEventListener("keydown",handler)}
    if(e.key==="ArrowLeft")next();
    if(e.key==="ArrowRight")prev();
  });
  let sx=null;
  img.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  img.addEventListener("touchend",e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40)(dx<0?next:prev)();
    sx=null;
  },{passive:true});
  render();
}

 try{

    `🟢 الحالة: ${n(a.status)}`,
    '',
    '📐 المواصفات',
    `• الغرف: ${n(a.rooms)}`,
    `• الحمامات: ${n(a.baths)}`,
    `• الصالات: ${n(a.living_rooms)}`,
    `• الصالونات: ${n(a.salons)}`,

    `• سنوي: ${money(a.annual_rent)} د.أ`,
    `• نوع الإيجار: ${n(a.rental_type)}`,
    '',
    '📅 التوفر',
    `• موعد التوفر: ${n(a.available_date||a.availability_date)}`,

    '━━━━━━━━━━━━━━━━━━━━',

/* v5.18: production backup + restore panel — owner only */
async function loadBackupPanel(){
  if(me?.role!=='owner') return;
  const box=document.getElementById('backupPanel');
  if(!box) return;
  try{
    const r=await fetch('/api/backup/status',{headers:{Authorization:'Bearer '+token}});
    const j=await r.json();
    if(!r.ok) throw Error(j.error||'تعذر قراءة حالة النسخ الاحتياطي');
    const st=j.state||{};
    const last=st.lastSuccessAt?new Date(st.lastSuccessAt).toLocaleString('ar-JO'):'لم تُنشأ بعد';
    const list=(j.backups||[]).map((b,i)=>`<div class="backup-row"><div><b>${i===0?'أحدث نسخة':'نسخة احتياطية'}</b><div class="muted">${esc(b.name)} • ${(b.size/1024/1024).toFixed(2)} MB</div><small>${new Date(b.created_at).toLocaleString('ar-JO')}</small></div><div style="display:flex;gap:7px;flex-wrap:wrap"><a class="btn ghost" href="/api/backup/download/${encodeURIComponent(b.name)}" target="_blank">⬇ حفظ</a><button class="btn danger backup-restore-btn" data-name="${esc(b.name)}">♻️ استرجاع</button></div></div>`).join('')||'<div class="empty">لا توجد نسخ احتياطية حتى الآن</div>';
    box.innerHTML=`<div class="head"><div><h3>💾 النسخ الاحتياطي والحماية</h3><span class="muted">نسخة تلقائية كل 24 ساعة • الاحتفاظ بآخر 10 نسخ</span></div><button class="btn primary" id="backupNowBtn">إنشاء نسخة الآن</button></div><div class="backup-status-grid"><div><b>آخر نسخة ناجحة</b><span>${esc(last)}</span></div><div><b>عدد النسخ</b><span>${j.backups?.length||0} / 10</span></div><div><b>الحالة</b><span>${st.lastError?'⚠️ يوجد خطأ يحتاج مراجعة':'✅ النسخ الاحتياطي يعمل'}</span></div></div>${st.lastError?`<div class="notice danger-note">${esc(st.lastError)}</div>`:''}<div class="backup-list">${list}</div>`;
    document.getElementById('backupNowBtn')?.addEventListener('click',async()=>{
      if(!(await v58Confirm('إنشاء نسخة احتياطية','سيتم إنشاء نسخة من قاعدة البيانات والصور والملفات المهمة قبل المتابعة.')))return;

async function deleteSelectedPhotos(apartmentId){
  if(me?.role!=='owner') return alert('حذف الصور بالجملة متاح للمالك فقط');
  const ids=[...document.querySelectorAll('.photo-bulk-check:checked')]
    .filter(x=>String(x.dataset.apartmentId)===String(apartmentId))
    .map(x=>Number(x.dataset.photoId)).filter(Boolean);
  if(!ids.length) return alert('حدد صورة واحدة على الأقل للحذف');
  if(!(await v58Confirm('تأكيد حذف الصور المحددة',`سيتم حذف ${ids.length} صورة نهائياً. لا يمكن التراجع عن هذا الإجراء.`))) return;
  try{
    for(const id of ids){ await api('/api/documents/'+id,{method:'DELETE'}); }
    await load();
    editA(apartmentId);
    notify(`تم حذف ${ids.length} صورة`);
  }catch(e){alert(e.message)}
}

function editA(id){
  const a=D.apartments.find(x=>x.id===id),photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة');
  modal(`<div class="modalhead"><h3>تفاصيل الشقة ${esc(a.number)}</h3><button class="btn ghost" onclick="closeM()">✕ إغلاق</button></div>${aForm(a)}${me.role==='owner'?`<div class="v55-share-row"><button class="btn wa-btn" onclick="shareApartmentDetails(${id})">🟢 WhatsApp — التفاصيل</button></div>`:''}<div class="panel" style="margin-top:14px;padding:14px"><div class="head"><h3>📷 صور الشقة</h3><span class="muted">${photos.length} صورة</span></div>${photos.length?`<div class="photo-bulk-tools"><label class="btn ghost"><input type="checkbox" id="selectAllPhotos_${id}" onchange="toggleAllPhotoSelection(${id},this.checked)" style="margin-left:6px"> تحديد الكل</label>${me.role==='owner'?`<button class="btn danger" onclick="deleteSelectedPhotos(${id})">🗑 حذف الصور المحددة</button>`:''}</div>`:''}${me.role==='owner'&&photos.length?`<button class="btn wa-btn" onclick="shareApartmentPhotos(${id})">🟢 WhatsApp — الصور</button>`:''}${me.role!=='user'?`<input id="apPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadApartmentPhotos(${id})">`:''}<div id="photos_${id}" class="photos">${photos.length?photos.map((p,i)=>photoHtml(p,i)).join(''):'<div class="photoempty full">لا توجد صور لهذه الشقة</div>'}</div></div><div class="v513-export-note">🎥 تم إخفاء قسم الفيديو من تفاصيل الشقة حسب طلبك.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" onclick="saveA(${id})">حفظ التعديل</button>${me.role==='owner'?`<button class="btn danger" onclick="delA(${id})">حذف الشقة</button>`:''}</div>`)
}

async function shareApartmentPhotos(id){
  if(me?.role!=='owner')return alert('المشاركة متاحة للمالك فقط');
  const photos=D.documents.filter(d=>d.apartment_id===id&&d.kind==='صورة شقة');
  if(!photos.length)return alert('لا توجد صور لهذه الشقة');
  const box=document.createElement('div'); box.className='wa-picker';
  box.innerHTML=`<div class="wa-picker-box"><div class="modalhead"><h3>🟢 WhatsApp — اختر الصور</h3><button class="btn ghost" id="pc">✕ إغلاق</button></div><div class="notice">حدد الصور التي تريد إرسالها. يمكنك إلغاء تحديد الصور قبل الإرسال.</div><div class="wa-photo-list">${photos.map((p,i)=>`<label class="wa-photo-item"><input type="checkbox" data-i="${i}"><img src="/uploads/${encodeURIComponent(p.filename)}" alt="صورة ${i+1}"></label>`).join('')}</div><div class="wa-range-actions"><button class="btn ghost" id="pa">تحديد الكل</button><button class="btn ghost" id="pcancel">إلغاء تحديد الصور</button><button class="btn wa-btn" id="ps">🟢 WhatsApp — إرسال</button></div><div id="waCount" class="muted" style="margin-top:8px;text-align:center">0 صورة محددة</div></div>`;
  document.body.appendChild(box);
  const update=()=>{const n=box.querySelectorAll('input[type=checkbox]:checked').length;box.querySelector('#waCount').textContent=`${n} صورة محددة`};
  box.querySelector('#pc').onclick=()=>box.remove();
  box.onclick=e=>{if(e.target===box)box.remove()};
  box.querySelector('#pa').onclick=()=>{box.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=true;cb.closest('.wa-photo-item')?.classList.add('selected')});update()};
  box.querySelector('#pcancel').onclick=()=>{box.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=false;cb.closest('.wa-photo-item')?.classList.remove('selected')});update()};
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{cb.closest('.wa-photo-item')?.classList.toggle('selected',cb.checked);update()});
  box.querySelector('#ps').onclick=async()=>{
    try{
      const chosen=[...box.querySelectorAll('input[type=checkbox]:checked')].map(cb=>photos[+cb.dataset.i]);
      if(!chosen.length)return alert('حدد صورة واحدة على الأقل');
      const files=[];
      for(const d of chosen){const r=await fetch('/uploads/'+encodeURIComponent(d.filename),{credentials:'same-origin',cache:'no-store'});if(r.ok){const b=await r.blob();files.push(new File([b],d.original_name||d.filename,{type:b.type||'image/jpeg'}))}}
      if(!files.length)throw Error('تعذر تجهيز الصور للمشاركة');
      await v511ShareFiles(files,`صور الشقة`);box.remove();
    }catch(e){if(e.name!=='AbortError')alert(e.message)}
  };
}

/* v5.33 authoritative password visibility */
(function(){
  function wirePasswords(){
    document.querySelectorAll('input[type="password"]:not([data-v533-pass])').forEach(function(inp){
      inp.setAttribute('data-v533-pass','1');
      var wrap=inp.parentElement;
      if(!wrap) return;
      wrap.style.position='relative';
      var b=document.createElement('button');
      b.type='button';
      b.className='v533-pass-toggle';
      b.textContent='👁️';
      b.title='إظهار كلمة المرور';
      b.setAttribute('aria-label','إظهار كلمة المرور');
      b.onclick=function(e){
        e.preventDefault();
        var show=inp.type==='password';
        inp.type=show?'text':'password';
        b.textContent=show?'🙈':'👁️';
        b.title=show?'إخفاء كلمة المرور':'إظهار كلمة المرور';
        b.setAttribute('aria-label',b.title);
      };
      wrap.appendChild(b);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wirePasswords);
  else wirePasswords();
  new MutationObserver(wirePasswords).observe(document.documentElement,{subtree:true,childList:true});
})();

  .lux-hero-copy{width:100%}.lux-hero h1{font-size:32px}.lux-hero h2{font-size:20px}.lux-hero-btn{padding:10px 16px}.lux-types{font-size:18px}
  .lux-property b{font-size:19px}.lux-property small{font-size:14px}.lux-property .lux-prop-meta{font-size:13px}.lux-property .lux-prop-price{font-size:17px}
  .lux-topbar{height:70px;padding:0 10px}
  .lux-brand strong{font-size:13px}.lux-brand small{font-size:6px}
  .lux-brand img{width:38px;height:38px}
  .lux-owner b{display:none}.lux-owner span{width:40px;height:40px}
  .lux-icon-btn{width:42px;height:42px}
  .lux-page-title{font-size:17px;padding-top:13px}
  .lux-content{padding:12px 10px 28px}
  .lux-hero{min-height:390px;border-radius:19px}
  .lux-hero-content{min-height:390px;padding:28px 20px}
  .lux-hero h1{font-size:35px}.lux-hero h2{font-size:22px}
  .lux-hero p{font-size:13px}
  .lux-stats{grid-template-columns:1fr 1fr}
  .lux-stat{padding:11px 9px}.lux-stat-icon{width:38px;height:38px;flex-basis:38px}
  .lux-stat b{font-size:20px}.lux-stat span{font-size:10px}
  .lux-quick-grid,.lux-latest-grid{grid-template-columns:1fr}
  .lux-section-head{align-items:flex-start;flex-direction:column}
  .lux-outline-btn{width:100%}
  .lux-alert-strip{flex-wrap:wrap}
  .lux-alert-strip small{margin-right:0;width:100%;padding-right:26px}
}
</style>

<script id="v539-luxury-dashboard">
/* v5.41.0 — final UI correction inspired by the supplied reference image.
   Offices and lands are intentionally absent; the public-facing hero only mentions apartments and villas. */

function toggleLuxMenu(force){
  const side=document.getElementById('luxSide');
  const shade=document.getElementById('luxShade');
  if(!side||!shade)return;
  const open=typeof force==='boolean'?force:!side.classList.contains('open');
  side.classList.toggle('open',open);
  shade.classList.toggle('show',open);
}
function luxNav(p){
  toggleLuxMenu(false);
  nav(p);
}
function luxHomeNotification(){
  const n=Number(D?.stats?.soon||0);
  if(n>0) return `<button class="lux-icon-btn lux-bell" onclick="luxNav('apartments')" title="تنبيهات قرب التوفر">🔔<span>${n>99?'99+':n}</span></button>`;
  return `<button class="lux-icon-btn" onclick="luxNav('apartments')" title="التنبيهات">🔔</button>`;
}

function shell(){
  const titles={home:"الرئيسية",apartments:"الشقق والعقارات",tenants:"المستأجرون والعقود",finance:"الدفعات والمالية",users:"المستخدمون والصلاحيات",logs:"سجل العمليات",security:"النسخ الاحتياطي والحماية",chat:"محادثة المالك وAdmin"};
  const navBtn=(p,icon,label)=>`<button class="${page===p?'active':''}" onclick="luxNav('${p}')"><span>${icon}</span>${label}</button>`;
  $("root").innerHTML=`
  <div class="lux-app">
    <div id="luxShade" class="lux-shade" onclick="toggleLuxMenu(false)"></div>
    <aside id="luxSide" class="lux-side">
      <div class="lux-side-brand">
        <img src="/hero-realestate.svg" alt="شعار عقارات غرب عمان">
        <div><b>عقارات عمان الغربية</b><small>WEST AMMAN REAL ESTATE</small></div>
      </div>
      <div class="lux-side-title">القائمة الرئيسية</div>
      <div class="lux-nav">
        ${navBtn('home','⌂','الرئيسية')}
        ${navBtn('apartments','▦','الشقق')}
        ${navBtn('tenants','♙','المستأجرون والعقود')}
        ${navBtn('finance','د.أ','الدفعات والمالية')}
        ${navBtn('users','◉','المستخدمون والصلاحيات')}
        ${navBtn('logs','◷','سجل العمليات')}
        ${navBtn('security','🔐','النسخ والحماية')}
        ${["owner","admin"].includes(me.role)?navBtn('chat','💬','المحادثة'):''}
        <button onclick="logout()"><span>↪</span>خروج</button>
      </div>
      <div class="lux-side-footer">نظام إدارة عقارات غرب عمّان<br><small>PWA • SQLite</small></div>
    </aside>

    <main class="lux-main">
      <header class="lux-topbar">
        <button class="lux-menu-btn" onclick="toggleLuxMenu()" aria-label="فتح القائمة">☰</button>
        <div class="lux-brand">
          <img src="/hero-realestate.svg" alt="">
          <div><strong>عقارات عمان الغربية</strong><small>WEST AMMAN REAL ESTATE</small></div>
        </div>
        <div class="lux-actions">
          ${luxHomeNotification()}
          <button class="lux-owner" onclick="luxNav('security')" title="الحماية وتغيير كلمة المرور"><span>${me.role==="owner"?"♛":"●"}</span><b>${role()}</b></button>
        </div>
      </header>
      <div class="lux-page-title"><span>${titles[page]}</span></div>
      <div class="lux-content">${view()}</div>
      <footer>نظام إدارة عقارات غرب عمّان • PWA • SQLite</footer>
    </main>
  </div>`;
}

function home(){
  const s=D?.stats||{};
  const total=Number(s.total||0), rented=Number(s.rented||0), available=Number(s.available||0);
  const soon=Number(s.soon||0), money=Number(D?.money?.total||0);
  const latest=(D?.apartments||[]).slice(0,6);
  return `
  <section class="lux-hero" aria-label="واجهة عقارات عمان الغربية">
    <div class="lux-hero-bg"></div>
    <div class="lux-hero-overlay"></div>
  </section>
  <section class="lux-stats">
    <div class="lux-stat"><div class="lux-stat-icon">▥</div><div><b>${total.toLocaleString()}</b><span>إجمالي الشقق</span></div></div>
    <div class="lux-stat"><div class="lux-stat-icon">🔑</div><div><b>${rented.toLocaleString()}</b><span>المؤجرة / المحجوزة</span></div></div>
    <div class="lux-stat"><div class="lux-stat-icon">⌂</div><div><b>${available.toLocaleString()}</b><span>الشقق المتاحة</span></div></div>
    <div class="lux-stat lux-stat-alert" onclick="luxNav('apartments')"><div class="lux-stat-icon">🔔</div><div><b>${soon.toLocaleString()}</b><span>قريبة من التوفر</span></div></div>
    <div class="lux-stat"><div class="lux-stat-icon">د.أ</div><div><b>${money.toLocaleString()}</b><span>دفعات هذا الشهر</span></div></div>
  </section>
  ${soon>0?`<button class="lux-alert-strip" onclick="luxNav('apartments')"><span>🔴</span><b>${soon} شقة ستصبح متاحة قريباً</b></button>`:''}
  <section class="lux-quick">
    <div class="lux-section-head"><div><small>إدارة سريعة</small><h3>الوصول السريع</h3></div><button class="lux-outline-btn" onclick="luxNav('apartments')">عرض جميع الشقق</button></div>
    <div class="lux-quick-grid">
      <button onclick="luxNav('apartments')"><span>⌂</span><b>الشقق والعقارات</b><small>إضافة، تعديل، صور وتفاصيل</small></button>
      <button onclick="luxNav('tenants')"><span>♙</span><b>المستأجرون والعقود</b><small>متابعة العقود والحجوزات</small></button>
      <button onclick="luxNav('finance')"><span>د.أ</span><b>الدفعات والمالية</b><small>متابعة الدفعات الشهرية</small></button>
    </div>
  </section>
  <section class="lux-latest">
    <div class="lux-section-head"><div><small>آخر الإضافات</small><h3>أحدث الشقق</h3></div></div>
    <div class="lux-latest-grid">
      ${latest.length?latest.map(a=>`
        <button class="lux-property" onclick="editA(${a.id})">
          ${(()=>{const p=(D.documents||[]).find(d=>d.apartment_id===a.id&&d.kind==='صورة شقة');return p?`<img src="/uploads/${encodeURIComponent(p.filename)}" alt="شقة ${esc(a.number)}">`:`<div class="lux-property-empty">⌂</div>`})()}
          <div>
            <b>شقة ${esc(a.number)}</b>
            <small>${esc(a.area||'')}</small>
            <div class="lux-prop-meta"><span>🛏 ${a.rooms||0} غرف</span><span>🛁 ${a.baths||0} حمام</span><span>📐 ${a.size_m2||0} م²</span></div>
            ${me?.role==='owner'?`<div class="lux-prop-price">💰 ${Number(v511Price(a,a.rental_type||'شهري')).toLocaleString()} د.أ / ${esc(a.rental_type||'شهري')}</div>`:''}
          </div>
          <span>${badge(a.status)}</span>
        </button>`).join(''):'<div class="empty">لا توجد شقق مضافة بعد</div>'}
    </div>
  </section>`;
}

</script>

</body>
</html>
