nd:#152338;border:1px solid #3b4d67;padding:13px;border-radius:12px;z-index:500;font-weight:900}.photo-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.photo-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.photo-choice{position:relative}.photo-choice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.photo-choice input{position:absolute;top:7px;right:7px;z-index:1;width:20px;height:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.login-gear{display:flex;justify-content:center;margin-bottom:8px}.login-gear .brand-mark{width:76px;height:76px;font-size:38px}.search-row{display:flex;gap:8px;align-items:end}.search-row>*{flex:1}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px}.nav-item{white-space:nowrap;width:auto}.side-footer{display:none}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.content{padding:10px}.topbar{padding:9px 10px}.brand small{display:none}.hero{padding:20px}.filters{grid-template-columns:repeat(2,1fr)}.filters .search{grid-column:1/-1}.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.details-gallery{grid-template-columns:repeat(2,1fr)}.details-gallery img{height:150px}.detail-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.photo-list{grid-template-columns:repeat(3,1fr)}.panel-title{align-items:flex-start;flex-wrap:wrap}.search-row{flex-direction:column;align-items:stretch}}
